<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraphs out of a PDF — Verbatim paragraph finder</title>
<style>
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:#f4f0e8;color:#1d1b18;font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
a{color:#9b2335}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
header.app{border-bottom:1px solid #d9d2c3;padding:18px 0 14px}
header.app .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;margin:6px 0 4px}
.meta{font-size:14px;color:#4a453d}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.dot.ok{background:#1e6b3a}.dot.bad{background:#9b2335}
.badge{font-size:14px}
nav.tabs{border-bottom:1px solid #d9d2c3;margin-top:6px}
nav.tabs button{background:none;border:none;border-bottom:3px solid transparent;padding:10px 18px 8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;color:#4a453d}
nav.tabs button[aria-selected="true"]{color:#9b2335;border-bottom-color:#9b2335}
nav.tabs button:focus-visible,button:focus-visible,tr[tabindex]:focus-visible{outline:2px solid #9b2335;outline-offset:2px}
.cols{display:grid;grid-template-columns:250px 1fr;gap:34px;padding:22px 0 10px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
aside .card{border-top:2px solid #1d1b18;padding:12px 0 4px;margin-bottom:22px}
aside .sym{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bignum{font-family:Georgia,"Times New Roman",serif;font-size:46px;line-height:1.05;margin:8px 0 2px}
.bignum small{font-size:20px;color:#4a453d}
.bar{height:4px;background:#d9d2c3;margin:6px 0 4px}
.bar i{display:block;height:100%;background:#1d1b18}
.bar.bad i{background:#9b2335}
.how{font-size:12.5px;color:#4a453d;margin:2px 0 14px}
.red{color:#9b2335}.green{color:#1e6b3a}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px;margin-bottom:8px}
.tile{border-top:2px solid #1d1b18;padding-top:8px}
.tile .bignum{font-size:44px}
.actions{margin:20px 0 6px}
.actions button{background:#1d1b18;color:#f4f0e8;border:none;padding:9px 16px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.08em;cursor:pointer;margin:0 10px 10px 0}
.actions button:disabled{background:#b7ae9d;cursor:not-allowed}
.fold{margin:14px 0}
.fold>button{background:none;border:none;border-bottom:1px solid #d9d2c3;width:100%;text-align:left;padding:9px 0;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;letter-spacing:.1em;cursor:pointer;color:#1d1b18}
.fold>button::after{content:" +"} .fold>button[aria-expanded="true"]::after{content:" −"}
.fold .body{padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:6px 0 14px}
caption{font-family:Georgia,"Times New Roman",serif;font-size:17px;text-align:left;padding:6px 0;caption-side:top}
th{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-align:left;border-bottom:1px solid #1d1b18;padding:6px 8px}
td{border-bottom:1px solid #d9d2c3;padding:7px 8px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:#ece6d9}
tr.detail td{background:#faf7f0}
.sus{border:1px solid #9b2335;padding:0 3px}
.checks p{margin:5px 0;font-size:14px}
.mismatch{margin:4px 0 6px;font-size:14px}
.cite-btn{background:none;border:1px solid #1d1b18;padding:5px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.08em;cursor:pointer;margin-right:10px}
.linelist{font-size:13px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
.pagemark{color:#9b2335}
footer.app{border-top:1px solid #d9d2c3;margin-top:16px;padding:14px 0 30px;font-size:13px;color:#4a453d}
h2.serif,h3.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}
h3.serif{font-size:19px;margin:20px 0 6px}
.fig{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;letter-spacing:.12em;color:#4a453d}
</style>
</head>
<body>
<header class="app"><div class="wrap"><div class="top">
  <div>
    <span class="mono">UN DOCUMENT · PDF TEXT</span>
    <h1 id="docTitle"></h1>
    <div class="meta" id="docMeta"></div>
  </div>
  <div class="badge" id="checkBadge"></div>
</div>
<nav class="tabs" role="tablist" aria-label="Sections" id="tablist">
  <button role="tab" id="tab1" aria-controls="panel1" aria-selected="true">01 RESULT</button>
  <button role="tab" id="tab2" aria-controls="panel2" aria-selected="false" tabindex="-1">02 PARAGRAPHS</button>
</nav>
</div></header>

<div class="wrap cols">
<aside id="rail" aria-label="Document"></aside>
<main>
  <section id="panel1" role="tabpanel" aria-labelledby="tab1"></section>
  <section id="panel2" role="tabpanel" aria-labelledby="tab2" hidden></section>
</main>
</div>

<footer class="app"><div class="wrap" id="foot"></div></footer>

<script>
(function(){
"use strict";
const D = window.WORKSHOP_DATA.pdf_text;
const ref = D.reference || null;
const refParas = ref && ref.paragraphs != null ? ref.paragraphs : null;
const refNotes = ref && ref.footnotes != null ? ref.footnotes : null;
const firstWordsRef = (ref && ref.first_words) || {};

/* ---------- per-page split: header, footer, body ---------- */
const pages = [].concat(D.records||[]).sort((a,b)=>a.page-b.page);
const body = [];              // {text, page, blank, cls, para, suspect, reason}
const headerPages = [], pageFooterNum = [], bareFooter = [], headerWarn = [];
let totalNonEmpty = 0, footerLines = 0, headerLines = 0;

const isFooterLine = (t, page) => {
  if (/^GE\./.test(t)) return "job code";
  if (/^(\d{6})(\s+\d{6})*$/.test(t)) return "date stamp";
  if (/^\d{1,3}$/.test(t)) return String(page) === t ? "page number" : "bare number";
  return null;
};

pages.forEach(p => {
  const lines = String(p.text||"").split(/\r?\n/);
  totalNonEmpty += lines.filter(l => l.trim() !== "").length;
  // header
  let i = 0;
  while (i < lines.length && lines[i].trim() === "") i++;
  if (i < lines.length && lines[i].trim() === D.symbol) { headerLines++; headerPages.push(p.page); i++; }
  else if (i < lines.length) headerWarn.push(p.page);
  // footer
  let j = lines.length - 1;
  while (j >= i) {
    const t = lines[j].trim();
    if (t === "") { j--; continue; }
    const f = isFooterLine(t, p.page);
    if (!f) break;
    if (f === "page number") pageFooterNum.push(p.page);
    if (f === "bare number") bareFooter.push({page:p.page, value:t});
    footerLines++; j--;
  }
  // body
  for (let k = i; k <= j; k++) {
    const t = lines[k];
    body.push({text:t, raw:t, page:p.page, blank:t.trim()==="", cls:null, para:null, suspect:false, reason:null});
  }
});

/* ---------- line classifiers ---------- */
const mPara = t => { const m = t.match(/^(\d{1,3})\.$/) ; if (m) return {num:+m[1], text:null};
  const m2 = t.match(/^(\d{1,3})\. (.+)$/); if (m2) return {num:+m2[1], text:m2[2]}; return null; };
const isLabel = t => /^([IVX]+|[A-Z])\.$/.test(t);
const headingish = t => { const s=t.trim(); return s!=="" && s.length<=90 && /^[A-Z]/.test(s) && !/[.;:,\d]$/.test(s); };

// pass 1: mark labels and paragraph starts
body.forEach(L => { L.pstart = !L.blank && mPara(L.text); L.label = !L.blank && isLabel(L.text); });

// pass 2: labelled heading text (label .. up to next label or paragraph start)
for (let i = 0; i < body.length; i++) {
  if (!body[i].label) continue;
  body[i].cls = "heading";
  let j = i + 1;
  while (j < body.length && !body[j].label && !body[j].pstart) {
    if (!body[j].blank) body[j].cls = "heading";
    j++;
  }
  i = j - 1;
}

// pass 3: unlabelled headings (line immediately before a paragraph start)
const nextNonBlank = i => { for (let j=i+1;j<body.length;j++) if(!body[j].blank) return j; return -1; };
const prevNonBlank = i => { for (let j=i-1;j>=0;j--) if(!body[j].blank) return j; return -1; };
const groupText = new Map();
for (let i = 0; i < body.length; i++) {
  const L = body[i];
  if (L.blank || L.cls !== null || L.pstart || L.label) continue;
  const n = nextNonBlank(i);
  if (n < 0 || !body[n].pstart || !headingish(L.text)) continue;
  const p = prevNonBlank(i);
  if (p >= 0 && body[p].cls === null && !body[p].blank && !body[p].pstart && headingish(body[p].text)) {
    body[p].cls = "heading2"; L.cls = "heading";
    groupText.set(i, body[p].text.trim() + " " + L.text.trim());
  } else {
    L.cls = "heading";
    groupText.set(i, L.text.trim());
  }
}

/* ---------- walk: cover, headings in order, paragraphs ---------- */
const paragraphs = [], stream = [];
let cur = null, curPart = "", curSection = "", coverCount = 0, hyphenEnd = 0;
function closeCur(){
  if (!cur) return;
  cur.text = cur.lines.map(l=>l.text).join(" ").replace(/  +/g," ").trim();
  paragraphs.push(cur); stream.push({type:"p", p:cur});
  cur = null;
}
for (let i = 0; i < body.length; i++) {
  const L = body[i];
  if (L.blank) continue;
  if (L.cls === "heading2") continue;                       // tail of a two-line heading
  if (L.cls === "heading" && L.label) {                     // labelled heading
    closeCur();
    const parts = [L.text.trim()];
    let j = i + 1;
    while (j < body.length && body[j].cls === "heading" && !body[j].label) {
      if (!body[j].blank) parts.push(body[j].text.trim());
      j++;
    }
    const full = parts.join(" ");
    curPart = full; curSection = full;
    stream.push({type:"h", level:"part", text:full});
    i = j - 1; continue;
  }
  if (L.cls === "heading") {                                // unlabelled heading
    closeCur();
    curSection = groupText.get(i) || L.text.trim();
    stream.push({type:"h", level:"section", text:curSection});
    continue;
  }
  if (L.pstart) {                                           // paragraph start
    closeCur();
    const m = mPara(L.text);
    cur = {num:m.num, section:curSection, part:curPart, lines:[], text:"", pageStart:L.page, pageEnd:L.page, flagged:false, reasons:[], fwFound:"", fwMatch:null, suspectCount:0};
    if (m.text) cur.lines.push(L);
    L.cls = "para"; L.para = m.num;
    continue;
  }
  if (/[A-Za-z]-$/.test(L.text.trim())) hyphenEnd++;
  if (cur) { L.cls = "para"; L.para = cur.num; cur.lines.push(L); }
  else { L.cls = "cover"; coverCount++; }
}
closeCur();
paragraphs.forEach(p => { p.pageStart = p.lines.length ? p.lines[0].page : null;
  p.pageEnd = p.lines.length ? p.lines[p.lines.length-1].page : null; });

/* ---------- suspect lines (footnote text that stayed in a paragraph) ---------- */
function suspectWhy(t){
  const s = t.trim();
  if (/^\d{1,3}$/.test(s)) return "bare number";
  if (/^\d{1,3} [A-Z\u201C"]/.test(s)) return "starts with a number and a space";
  if (/^\* /.test(s)) return "asterisk note";
  return null;
}
const tainted = {};
paragraphs.forEach(p => p.lines.forEach(L => {
  const w = tainted[L.page] ? (tainted[L.page], true) : false;
  const why = suspectWhy(L.text);
  if (why || tainted[L.page]) { L.suspect = true; L.reason = why || "after a suspect line on this page";
    tainted[L.page] = true; p.suspectCount++; if (why && p.reasons.indexOf(why)<0) p.reasons.push(why); }
}));
paragraphs.forEach(p => {
  const words = p.text ? p.text.split(/\s+/).length : 0;
  p.wordCount = words;
  p.flagged = p.suspectCount > 0 || words > 300;
  if (words > 300 && p.reasons.indexOf("paragraph over 300 words")<0) p.reasons.push("paragraph over 300 words");
});
const flaggedPages = [];
pages.forEach(pg => {
  const lines = body.filter(L => L.page === pg.page && L.suspect && L.cls === "para");
  if (!lines.length) return;
  const paras = [...new Set(lines.map(L=>L.para))];
  const reasons = [...new Set(lines.map(L=>L.reason).filter(r=>r&&r!=="after a suspect line on this page"))];
  paragraphs.filter(p=>p.wordCount>300 && p.pageStart<=pg.page && p.pageEnd>=pg.page)
    .forEach(p=>{ if(reasons.indexOf("paragraph over 300 words")<0) reasons.push("paragraph over 300 words"); });
  flaggedPages.push({page:pg.page, paras, count:lines.length, reasons});
});

/* ---------- first words, checked against the reference ---------- */
function stripFootnoteMarks(text){
  const toks = text.split(/\s+/); const out = [];
  for (let k = 0; k < toks.length && out.length < 6; k++) {
    let t = toks[k];
    if (/^\d+$/.test(t)) {
      const prev = k > 0 ? toks[k-1] : "";
      const ends = /[.,\u201D\u2019"']$/.test(prev);
      const abbr = /^(no|art)\.$/i.test(prev);
      if (k > 0 && ends && !abbr) continue;
      out.push(t); continue;
    }
    t = t.replace(/\d+$/, "");
    if (t) out.push(t);
  }
  return out.join(" ");
}
const norm = s => String(s||"").replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
  .replace(/[\u2013\u2014]/g,"-").replace(/\s+/g," ").trim();
paragraphs.forEach(p => {
  p.fwFound = stripFootnoteMarks(p.text);
  const r = firstWordsRef[String(p.num)];
  p.fwRef = r != null ? r : null;
  p.fwMatch = r == null ? null : norm(p.fwFound) === norm(r);
});
const fwMismatches = paragraphs.filter(p => p.fwMatch === false);

/* ---------- numbering check ---------- */
const numsInOrder = paragraphs.map(p=>p.num);
let numberingOK = true; const numberingIssues = [];
for (let i=0;i<numsInOrder.length;i++) if (numsInOrder[i] !== i+1) { numberingOK = false; numberingIssues.push("position "+(i+1)+": found para. "+numsInOrder[i]); }
const seen = {}; paragraphs.forEach(p=>{ seen[p.num]=(seen[p.num]||0)+1; });
Object.keys(seen).forEach(n=>{ if(seen[n]>1) numberingIssues.push("duplicate para. "+n); });

/* ---------- citations and exports ---------- */
const cite = n => D.symbol + ", para. " + n;
paragraphs.forEach(p => {
  p.citation = cite(p.num);
  p.limitations = p.flagged && p.suspectCount
    ? "footnotes not separated; " + p.suspectCount + " may sit inside this paragraph"
    : "footnotes not separated";
});
function exportRecords(){
  return paragraphs.map(p => ({
    symbol: D.symbol, paragraph: p.num, section: p.section || "", part: p.part || "",
    page_start: p.pageStart, page_end: p.pageEnd, text: p.text, flagged: p.flagged,
    first_words_match: p.fwMatch, citation: p.citation, doc_url: D.doc_url,
    limitations: p.limitations, text_lines: p.lines.map(l=>l.text).join(" | ")
  }));
}
function markdownDoc(){
  const today = new Date().toISOString().slice(0,10);
  const fm = ["---","title: " + D.title,"symbol: " + D.symbol,
    "adopted: " + (ref && ref.adopted != null ? ref.adopted : "unknown"),
    "source_url: " + D.doc_url, "extracted: " + today,
    "paragraphs_found: " + paragraphs.length,
    "paragraphs_expected: " + (refParas != null ? refParas : "unknown"),
    "pages_flagged: " + flaggedPages.length,
    'footnotes: "not separated; the document has ' + (refNotes != null ? refNotes : "an unknown number of") + '"',
    "---",""].join("\n");
  const bodyMd = stream.map(s => s.type === "h"
    ? (s.level === "part" ? "## " : "### ") + s.text
    : "**" + s.p.num + "** " + s.p.text + (s.p.flagged && s.p.suspectCount ? " *(flagged: may contain footnote text)*" : "")
  ).join("\n\n");
  return fm + bodyMd + "\n";
}
function download(name, content, type){
  const blob = new Blob([content], {type: type + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
const fileBase = () => (D.symbol||"document").replace(/\//g,"-");

/* ---------- checks ---------- */
const unclassified = body.filter(L => !L.blank && L.cls === null);
const headingLineCount = body.filter(L => !L.blank && (L.cls==="heading"||L.cls==="heading2")).length;
const paraLineCount = body.filter(L => !L.blank && L.cls==="para").length;
const labelledHeadings = stream.filter(s=>s.type==="h"&&s.level==="part");
const unlabelledHeadings = stream.filter(s=>s.type==="h"&&s.level==="section");
const roundTrip = exportRecords(); let roundTripOK = false;
try { roundTripOK = JSON.parse(JSON.stringify(roundTrip)).length === paragraphs.length; } catch(e){}

const checks = [];
const addC = (name, story, pass) => checks.push({name, story, pass});   // pass: true/false/null(note)
if (refParas != null) addC("Paragraph count",
  "Paragraphs found by this code: " + paragraphs.length + " · the document's reference says " + refParas + ". Given this data and this code we expect them to be equal.",
  paragraphs.length === refParas ? true : false);
else addC("Paragraph count", paragraphs.length + " paragraphs found · no reference in this file, not run.", null);
addC("Numbering",
  "The " + paragraphs.length + " paragraph numbers, in document order, should read 1 to " + paragraphs.length + " with no gaps or duplicates." +
  (numberingIssues.length ? " Issues: " + numberingIssues.join("; ") + "." : ""),
  numberingIssues.length ? false : true);
if (refParas != null || Object.keys(firstWordsRef).length)
  addC("First words", fwMismatches.length === 0
    ? "The first six words of all " + paragraphs.length + " paragraphs match the reference (footnote marks removed before comparing)."
    : fwMismatches.length + " of " + paragraphs.length + " paragraphs differ from the reference's first words.",
    fwMismatches.length === 0);
else addC("First words", "no reference first words in this file, not run.", null);
addC("Pages flagged", flaggedPages.length + " page(s) flagged, " + paragraphs.filter(p=>p.flagged).length +
  " paragraph(s) to check against the PDF. A flag is a warning, not a failure: the count can be right while footnote text sits inside a paragraph.", null);
addC("Suspect lines", body.filter(L=>L.suspect).length + " suspect line(s) on " + flaggedPages.length +
  " page(s), inside " + paragraphs.filter(p=>p.suspectCount>0).length + " paragraph(s); none was removed.", null);
addC("Headers and footers",
  headerPages.length + " of " + pages.length + " pages opened with the symbol " + D.symbol + " as first line (expected all)" +
  (headerWarn.length ? " — pages " + headerWarn.join(", ") + " did not" : "") + ". " +
  pageFooterNum.length + " pages carried their page number in the footer (expected all but the first). " +
  (bareFooter.length ? "Bare numbers removed from footiers (displaced footnote numbers, not put back): " +
    bareFooter.map(b=>"p." + b.page + " “" + b.value + "”").join(", ") + "." : "No bare numbers were removed from footers."),
  headerWarn.length === 0 && pageFooterNum.length === pages.length - 1);
addC("Headings",
  labelledHeadings.length + " labelled heading(s) and " + unlabelledHeadings.length + " unlabelled heading(s) found. Unlabelled: " +
  (unlabelledHeadings.length ? unlabelledHeadings.map(h=>"“"+h.text+"”").join(", ") : "none") +
  " — a paragraph's last line mistaken for a heading would appear here.", null);
const classifiedSum = headerLines + footerLines + coverCount + headingLineCount + paraLineCount;
addC("Nothing lost",
  "Non-empty lines in the file: " + totalNonEmpty + " · classified as header " + headerLines + ", footer " + footerLines +
  ", cover " + coverCount + ", heading " + headingLineCount + ", paragraph " + paraLineCount + " (sum " + classifiedSum + ")." +
  (unclassified.length ? " UNCLASSIFIED: " + unclassified.map(L=>"p." + L.page + " “" + L.text.trim().slice(0,40) + "”").join("; ") : ""),
  classifiedSum === totalNonEmpty && unclassified.length === 0);
addC("Hyphen-ended lines", hyphenEnd + " line(s) end with a hyphen (none expected in this file; none was joined).", null);
addC("Export round trip", "The JSON offered for download parses back to " + roundTrip.length + " record(s), equal to the " + paragraphs.length + " rows of the table.",
  roundTripOK);

const passChecks = checks.filter(c=>c.pass===true).length;
const failChecks = checks.filter(c=>c.pass===false).length;
const scoreChecks = checks.filter(c=>c.pass!==null).length;

/* ---------- render ---------- */
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstElementChild; }
function copyText(t){
  const done=()=>{};
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done,()=>fb(t)); else fb(t);
  function fb(t){ const ta=document.createElement("textarea"); ta.value=t; document.body.appendChild(ta); ta.select();
    try{document.execCommand("copy")}catch(e){} ta.remove(); }
}

// header
document.getElementById("docTitle").textContent = D.title || D.symbol || "Document";
document.getElementById("docMeta").innerHTML =
  '<a href="' + esc(D.doc_url) + '" target="_blank" rel="noopener">' + esc(D.symbol) + "</a>" +
  (ref && ref.adopted ? " · adopted " + esc(ref.adopted) : "") +
  " · " + pages.length + " pages · " + esc(D.source || "");
document.getElementById("checkBadge").innerHTML =
  '<span class="dot ' + (failChecks ? "bad" : "ok") + '"></span>' +
  (failChecks ? '<span class="red">' + failChecks + " check" + (failChecks>1?"s":"") + " failed</span>"
              : '<span class="green">' + passChecks + " of " + scoreChecks + " checks pass</span>") +
  ' · <span class="' + (flaggedPages.length ? "red" : "") + '">' + flaggedPages.length + " page" + (flaggedPages.length===1?"":"s") + " flagged</span>";

// rail
const pct = refParas ? Math.min(100, Math.round(paragraphs.length / refParas * 100)) : 100;
document.getElementById("rail").innerHTML =
  '<div class="card"><div class="mono">DOCUMENT</div>' +
  '<div class="sym">' + esc(D.symbol) + "</div>" +
  '<div style="font-size:13px;color:#4a453d">General comment, PDF converter text</div></div>' +
  '<div class="card"><div class="mono">PARAGRAPHS</div>' +
  '<div class="bignum">' + paragraphs.length + " <small>of " + (refParas!=null?refParas:"?") + "</small></div>" +
  '<div class="bar' + (refParas!=null && paragraphs.length!==refParas ? " bad":"") + '"><i style="width:' + pct + '%"></i></div>' +
  '<div class="how">numbered paragraphs found by this page\u2019s code</div></div>' +
  '<div class="card"><div class="mono">PAGES FLAGGED</div>' +
  '<div class="bignum' + (flaggedPages.length ? " red":"") + '">' + flaggedPages.length + ' <small>of ' + pages.length + "</small></div>" +
  '<div class="how">footnote text may sit inside a paragraph</div></div>' +
  '<div class="card"><div class="mono">CHECKS</div>' +
  '<div class="bignum" style="font-size:34px">' + passChecks + " <small>of " + scoreChecks + "</small></div>" +
  '<div class="how">pass' + (failChecks ? ' · <span class="red">' + failChecks + " failed</span>" : "") + "</div></div>";

document.getElementById("foot").innerHTML = esc(D.source||"") + " · built " + esc(D.built||"") +
  " · Done by this page\u2019s code; no model was called and nothing left the browser.";

/* ----- tab 01 ----- */
const p1 = document.getElementById("panel1");
const equalCount = refParas!=null && paragraphs.length===refParas;
let html = '<div class="tiles">' +
  '<div class="tile"><div class="mono">PARAGRAPHS FOUND</div>' +
  '<div class="bignum' + (refParas==null ? "" : equalCount ? ' green' : ' red') + '">' + paragraphs.length + "</div>" +
  '<div>' + (refParas==null ? "no reference in this file" :
    (equalCount ? '<span class="green">the document has ' + refParas + "</span>"
                : '<span class="red">the document has ' + refParas + " (difference " + (paragraphs.length-refParas>0?"+":"") + (paragraphs.length-refParas) + ")</span>")) + "</div>" +
  '<div class="how">How this is computed: a line is a paragraph start when it is “n.” alone or “n. text”; both forms are accepted.</div></div>' +
  '<div class="tile"><div class="mono">FIRST WORDS MATCH</div>' +
  '<div class="bignum">' + (paragraphs.length - fwMismatches.length) + (refParas!=null ? " <small>of " + refParas + "</small>" : "") + "</div>" +
  '<div>' + (refParas==null ? "no reference in this file" :
    fwMismatches.length===0 ? '<span class="green">all match the reference</span>'
                            : '<span class="red">' + fwMismatches.length + " differ</span>") + "</div>" +
  '<div class="how">How this is computed: first six words of each paragraph, footnote marks removed, compared with the reference\u2019s first words.</div></div>' +
  '<div class="tile"><div class="mono">PAGES FLAGGED</div>' +
  '<div class="bignum' + (flaggedPages.length ? " red":"") + '">' + flaggedPages.length + "</div>" +
  '<div>of the document\u2019s ' + pages.length + " pages · footnote text may sit inside a paragraph: check these paragraphs against the PDF</div>' +
  '<div class="how">How this is computed: a line inside a paragraph that is a bare number, starts “n Capital”, or starts “* ” marks the rest of its page as suspect.</div></div>' +
  '<div class="tile"><div class="mono">FOOTNOTES</div>' +
  '<div class="bignum red" style="font-size:30px">not separated</div>' +
  '<div>the document has ' + (refNotes!=null ? refNotes : "an unknown number of") + "; this version leaves them in place and flags them</div>" +
  '<div class="how">Footnote lines stay in the paragraph text; suspect lines are marked so you can check them against the PDF.</div></div>' +
  "</div>";

if (fwMismatches.length) {
  html += '<h3 class="serif">First words differ on ' + fwMismatches.length + " paragraph" + (fwMismatches.length>1?"s":"") + "</h3>";
  fwMismatches.slice(0,10).forEach(p => {
    html += '<div class="mismatch"><span class="red">para. ' + p.num + ":</span> found \u201C" + esc(p.fwFound) + "\u201D / reference \u201C" + esc(p.fwRef) + "\u201D</div>";
  });
  if (fwMismatches.length > 10) html += '<div class="mismatch">and ' + (fwMismatches.length-10) + " more</div>";
}
if (!paragraphs.length) html += '<p class="red">No paragraph was found in this file. The exports are disabled.</p>';

html += '<div class="actions"><button id="dlJson" ' + (paragraphs.length?"":"disabled") + '>DOWNLOAD JSON</button>' +
  '<button id="dlMd" ' + (paragraphs.length?"":"disabled") + '>DOWNLOAD MARKDOWN</button></div>' +
  '<div class="how">The JSON and Markdown carry every paragraph with its symbol, heading, pages, citation and limitations, so the dataset travels with its source.</div>';

// every check (closed)
html += '<div class="fold"><button aria-expanded="false" id="foldChecks">EVERY CHECK (' + checks.length + ")</button><div class="body" hidden></div></div>";
// flagged pages (closed)
html += '<div class="fold"><button aria-expanded="false" id="foldFlag"' + (flaggedPages.length?"":" disabled") + '>FLAGGED PAGES (' + flaggedPages.length + ")</button><div class=\"body\" hidden></div></div>";
p1.innerHTML = html;

const checksBody = p1.querySelectorAll(".fold .body")[0];
checksBody.innerHTML = '<div class="checks">' + checks.map(c =>
  "<p><span class=\"mono\">" + esc(c.name) + "</span><br>" + esc(c.story) + " " +
  (c.pass===true ? '<span class="green">\u2713 pass</span>' : c.pass===false ? '<span class="red">\u2717 check failed</span>' : '<span style="color:#4a453d">— noted</span>') +
  "</p>").join("") + "</div>";

const flagBody = p1.querySelectorAll(".fold .body")[1];
let fh = '<p style="font-size:14px">This version does not separate footnotes from paragraphs. It shows where footnote text may sit, so you know which paragraphs to check against the PDF.</p>' +
  '<table><caption>' + flaggedPages.length + " page" + (flaggedPages.length===1?"":"s") + " with footnote text inside a paragraph</caption>" +
  '<tr><th class="num">PAGE</th><th>PARAGRAPH</th><th class="num">SUSPECT LINES</th><th>WHY</th></tr>';
flaggedPages.forEach((f,idx) => {
  fh += '<tr class="row" tabindex="0" role="button" aria-expanded="false" data-fp="' + idx + '">' +
    '<td class="num">' + f.page + "</td><td>" + f.paras.join(", ") + '</td><td class="num">' + f.count + "</td><td>" + esc(f.reasons.join("; ")) + "</td></tr>" +
    '<tr class="detail" hidden><td colspan="4"></td></tr>';
});
fh += "</table>";
flagBody.innerHTML = fh;
flagBody.addEventListener("click", e => {
  const r = e.target.closest("tr.row[data-fp]"); if (!r) return;
  const d = r.nextElementSibling;
  if (!d.hidden) { d.hidden = true; r.setAttribute("aria-expanded","false"); return; }
  const f = flaggedPages[+r.dataset.fp];
  const lines = body.filter(L => L.page === f.page && !L.blank);
  d.firstElementChild.innerHTML = '<div class="linelist">' + lines.map(L =>
    (L.suspect ? '<span class="sus">' + esc(L.text) + "</span>" : esc(L.text)) +
    ' <span style="color:#8a8271">[' + L.cls + (L.para!=null ? ", para. " + L.para : "") + "]</span>"
  ).join("\n") + "</div>";
  d.hidden = false; r.setAttribute("aria-expanded","true");
});
flagBody.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ const r=e.target.closest("tr.row[data-fp]"); if(r){ e.preventDefault(); r.click(); } } });

p1.querySelectorAll(".fold > button").forEach(b => b.addEventListener("click", () => {
  const open = b.getAttribute("aria-expanded")==="true";
  b.setAttribute("aria-expanded", String(!open));
  b.nextElementSibling.hidden = open;
}));

document.getElementById("dlJson").addEventListener("click", () =>
  download(fileBase() + ".json", JSON.stringify(exportRecords(), null, 2), "application/json"));
document.getElementById("dlMd").addEventListener("click", () =>
  download(fileBase() + ".md", markdownDoc(), "text/markdown"));

/* ----- tab 02 ----- */
const p2 = document.getElementById("panel2");
const headingsBox = '<div class="fold"><button aria-expanded="false" id="foldHead">HEADINGS FOUND (' + stream.filter(s=>s.type==="h").length + ')</button><div class="body" hidden>' +
  stream.filter(s=>s.type==="h").map(s =>
    '<div class="mono" style="margin:3px 0">' + (s.level==="part"?"PART\u00A0\u00A0":"SECT\u00A0\u00A0") + esc(s.text) + "</div>").join("") +
  "</div></div>";

let th = headingsBox + '<table id="parTable"><caption>' + paragraphs.length + " paragraph" + (paragraphs.length===1?"":"s") +
  " found" + (refParas!=null ? ", " + refParas + " expected" : "") + "</caption>" +
  '<tr><th class="num">NO.</th><th>SECTION</th><th class="num">PAGE</th><th>FIRST LINE</th><th>CHECK</th></tr>';
paragraphs.forEach((p,i) => {
  const first = p.text.slice(0,120);
  const cut = p.text.length > 120 ? first.slice(0, first.lastIndexOf(" ")) + "\u2026" : first;
  let chk;
  if (p.flagged) chk = '<span class="red">may contain footnote text</span>';
  else if (p.fwMatch === false) chk = '<span class="red">first words differ</span>';
  else chk = '<span class="green">OK</span>';
  th += '<tr class="row" tabindex="0" role="button" aria-expanded="false" data-i="' + i + '">' +
    '<td class="num">' + p.num + "</td><td>" + esc(p.section || p.part || "") + '</td><td class="num">' +
    (p.pageStart === p.pageEnd ? p.pageStart : p.pageStart + "\u2013" + p.pageEnd) + "</td><td>" + esc(cut) + "</td><td>" + chk + "</td></tr>" +
    '<tr class="detail" hidden><td colspan="5"></td></tr>';
});
th += "</table>";
p2.innerHTML = th;

const headFold = p2.querySelector("#foldHead");
headFold.addEventListener("click", () => {
  const open = headFold.getAttribute("aria-expanded")==="true";
  headFold.setAttribute("aria-expanded", String(!open));
  headFold.nextElementSibling.hidden = open;
});

function expandRow(r){
  const d = r.nextElementSibling, cell = d.firstElementChild;
  if (!d.hidden) { d.hidden = true; r.setAttribute("aria-expanded","false"); return; }
  const p = paragraphs[+r.dataset.i];
  const textHtml = p.lines.map(l => l.suspect ? '<span class="sus">' + esc(l.text) + "</span>" : esc(l.text)).join(" ");
  let h = '<div class="mono">PARA. ' + p.num + " · " + esc(p.part || "") + (p.section && p.section !== p.part ? " \u203A " + esc(p.section) : "") + "</div>" +
    '<p style="max-width:70ch">' + textHtml + "</p>" +
    (p.flagged ? '<p class="red" style="font-size:14px">May contain footnote text (' + esc(p.reasons.join("; ")) + "). Check this paragraph against the PDF.</p>" : "") +
    '<p style="font-size:14px">First words, found: \u201C' + esc(p.fwFound) + "\u201D · reference: \u201C" +
    (p.fwRef!=null ? esc(p.fwRef) : "no reference") + "\u201D " +
    (p.fwMatch===true ? '<span class="green">match</span>' : p.fwMatch===false ? '<span class="red">differ</span>' : "") + "</p>" +
    '<button class="cite-btn" data-cite="' + esc(p.citation) + '">COPY CITATION</button>' +
    '<button class="cite-btn" data-lines="1">SHOW THE PDF\u2019S LINES</button>' +
    '<div class="linelist" hidden></div>';
  cell.innerHTML = h;
  const citeBtn = cell.querySelector("[data-cite]"), linesBtn = cell.querySelector("[data-lines]"), ll = cell.querySelector(".linelist");
  citeBtn.addEventListener("click", () => {
    copyText(p.citation);
    const old = citeBtn.textContent; citeBtn.textContent = "COPIED";
    setTimeout(()=>citeBtn.textContent = old, 2000);
  });
  linesBtn.addEventListener("click", () => {
    if (!ll.hidden) { ll.hidden = true; return; }
    let last = null;
    ll.innerHTML = p.lines.map(l => {
      const mark = l.page !== last ? '<span class="pagemark">\u2014 page ' + l.page + " \u2014</span>\n" : "";
      last = l.page;
      return mark + (l.suspect ? '<span class="sus">' + esc(l.text) + "</span>" : esc(l.text));
    }).join("\n");
    ll.hidden = false;
  });
  d.hidden = false; r.setAttribute("aria-expanded","true");
}
p2.addEventListener("click", e => { const r = e.target.closest("tr.row[data-i]"); if (r) expandRow(r); });
p2.addEventListener("keydown", e => { if (e.key==="Enter"||e.key===" "){ const r=e.target.closest("tr.row[data-i]"); if(r){ e.preventDefault(); expandRow(r); } } });

/* ----- tabs: click + arrow keys ----- */
const tabs = [document.getElementById("tab1"), document.getElementById("tab2")];
const panels = [document.getElementById("panel1"), document.getElementById("panel2")];
function selectTab(i){
  tabs.forEach((t,k)=>{ t.setAttribute("aria-selected", String(k===i)); t.tabIndex = k===i?0:-1; panels[k].hidden = k!==i; });
  tabs[i].focus();
}
tabs.forEach((t,i)=>t.addEventListener("click", ()=>selectTab(i)));
document.getElementById("tablist").addEventListener("keydown", e => {
  if (e.key==="ArrowRight"){ e.preventDefault(); selectTab(1); }
  if (e.key==="ArrowLeft"){ e.preventDefault(); selectTab(0); }
});
})();
</script>
</body>
</html>
