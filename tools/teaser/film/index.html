<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Garage Research teaser</title>
<style>
/* Faces: Source Serif 4 (titles, captions) and JetBrains Mono (labels), both SIL OFL. Copied from the film studio. */
@font-face { font-family: "Source Serif 4"; font-weight: 400; src: url(fonts/source-serif-4-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 500; src: url(fonts/source-serif-4-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 600; src: url(fonts/source-serif-4-latin-600-normal.woff2) format("woff2"); }
@font-face { font-family: "Source Serif 4"; font-weight: 400; src: url(fonts/source-serif-4-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: "Source Serif 4"; font-weight: 500; src: url(fonts/source-serif-4-latin-ext-500-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: "Source Serif 4"; font-weight: 600; src: url(fonts/source-serif-4-latin-ext-600-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 400; src: url(fonts/jetbrains-mono-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }
@font-face { font-family: "JetBrains Mono"; font-weight: 500; src: url(fonts/jetbrains-mono-latin-ext-500-normal.woff2) format("woff2"); unicode-range: U+0100-024F, U+1E00-1EFF; }

:root { --bg: #0d1117; --bar: #010409; --head: #161b22; --rule: #30363d; --ink: #e6edf3; --quiet: #9da7b3; --accent: #f0616d;
  --serif: "Source Serif 4", Georgia, serif; --mono: "JetBrains Mono", Menlo, monospace; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { color: var(--ink); -webkit-font-smoothing: antialiased; }
#film { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
.abs { position: absolute; }
.label { font-family: var(--mono); font-weight: 500; font-size: 26px; letter-spacing: .14em; color: var(--accent); text-transform: uppercase; white-space: nowrap; }
.mono { font-family: var(--mono); }
.serif { font-family: var(--serif); }
.scene { position: absolute; inset: 0; display: none; }
.thumb { position: absolute; width: 420px; height: 262px; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--bar); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
.screen { position: absolute; left: 60px; top: 90px; width: 1248px; height: 780px; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--bar); box-shadow: 0 30px 80px rgba(0,0,0,.6); }
.screen .inner { position: absolute; inset: 0; }
.screen img { position: absolute; left: 0; top: 0; width: 1248px; height: 780px; display: block; }
.side { position: absolute; left: 1360px; top: 130px; width: 500px; }
.side .t { font-family: var(--serif); font-weight: 500; font-size: 54px; line-height: 1.15; margin-top: 24px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.side .m { font-family: var(--mono); font-size: 26px; line-height: 1.5; color: var(--quiet); margin-top: 34px; }
.side .m b { color: var(--ink); font-weight: 500; display: block; font-size: 30px; }
.rule { height: 3px; background: var(--accent); margin-top: 28px; transform-origin: 0 50%; }
#subs { text-wrap: balance; position: absolute; left: 160px; right: 160px; bottom: 62px; text-align: center; display: none; }
#subs .cap { display: inline; font-family: var(--serif); font-weight: 500; font-size: 40px; line-height: 1.4; color: var(--ink); background: rgba(1,4,9,.92); padding: 4px 18px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
</style>
</head>
<body>
<div id="film"></div>
<div id="subs"><span class="cap"></span></div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="film.js"></script>
</body>
</html>
