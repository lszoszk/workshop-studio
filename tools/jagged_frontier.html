<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The jagged frontier · Garage Research</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root { --paper: #f4f0e8; --ink: #1d1b18; --muted: #57524a; --faint: #8a8378; --rule: #d9d2c3; --red: #9b2335;
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .slide { max-width: 1280px; min-height: 100vh; margin: 0 auto; padding: 40px 56px 28px; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; }
  .kicker { font: 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--red); }
  h1 { font: 400 40px/1.15 var(--serif); margin: 8px 0 0; max-width: 24ch; }
  .body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 40px; align-items: center; }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .grid line, .grid polygon { fill: none; stroke: var(--rule); stroke-width: 1; }
  .grid text { font: 11px var(--mono); fill: var(--faint); }
  .axis-label { font: 15px var(--serif); fill: var(--ink); }
  .series polygon { stroke-width: 2.5; stroke-linejoin: round; fill-opacity: .07; }
  .series circle { stroke: var(--paper); stroke-width: 2; cursor: default; }
  .series.dim { opacity: .18; }
  .legend { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 10px; }
  .legend button { all: unset; display: flex; align-items: baseline; gap: 10px; cursor: pointer; }
  .legend button:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  .legend .sw { width: 22px; height: 0; border-top: 3px solid; transform: translateY(-4px); flex: none; }
  .legend b { font: 400 21px/1.2 var(--serif); }
  .legend span.m { color: var(--muted); font-size: 14px; }
  .finds { margin: 0; padding: 0 0 0 18px; display: grid; gap: 10px; }
  .finds li { font-size: 17px; }
  .tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 9px; max-width: 280px; display: none; }
  footer { border-top: 1px solid var(--rule); padding-top: 10px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--red); }
  details { margin-top: 8px; }
  summary { font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; cursor: pointer; color: var(--muted); }
  table { border-collapse: collapse; margin-top: 10px; font-size: 13px; width: 100%; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th[scope=col] { font: 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; }
  @media (max-width: 860px) { .slide { padding: 24px 16px; } .body { grid-template-columns: 1fr; } h1 { font-size: 30px; } }
</style>
</head>
<body>
<div class="slide">
  <header>
    <div class="kicker">Session 8 · The jagged frontier</div>
    <h1>Same plans, three models: each is good at different tasks</h1>
  </header>
  <div class="body">
    <svg id="radar" viewBox="-330 -280 660 560" role="img" aria-labelledby="radarTitle"><title id="radarTitle">Radar chart: share of automatic checks passed by each model, per task</title></svg>
    <div>
      <ul class="legend" id="legend"></ul>
      <ol class="finds" id="finds"></ol>
    </div>
  </div>
  <footer>
    <div id="source"></div>
    <details><summary>The numbers as a table</summary><table id="table"></table></details>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>
<script>
const D = __DATA__;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const svg = document.getElementById('radar'), NS = 'http://www.w3.org/2000/svg', R = 200, n = D.axes.length;
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); (parent || svg).append(e); return e; };
const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [Math.cos(a) * R * v / 100, Math.sin(a) * R * v / 100]; };
const grid = el('g', { class: 'grid' });
[25, 50, 75, 100].forEach((v) => {
  el('polygon', { points: D.axes.map((_, i) => pt(i, v).join(',')).join(' ') }, grid);
  el('text', { x: 4, y: -R * v / 100 - 3 }, grid).textContent = v + '%';
});
D.axes.forEach(([, label], i) => {
  const [x, y] = pt(i, 100); el('line', { x1: 0, y1: 0, x2: x, y2: y }, grid);
  const [lx, ly] = pt(i, 118);
  const t = el('text', { x: lx, y: ly + 5, class: 'axis-label', 'text-anchor': Math.abs(lx) < 20 ? 'middle' : lx > 0 ? 'start' : 'end' });
  t.textContent = label;
});
const tip = document.getElementById('tip');
const groups = {};
Object.entries(D.models).forEach(([id, m]) => {
  const g = groups[id] = el('g', { class: 'series' });
  const pts = D.axes.map(([k], i) => pt(i, m.values[k] ?? 0));
  el('polygon', { points: pts.map((p) => p.join(',')).join(' '), stroke: m.colour, fill: m.colour }, g);
  D.axes.forEach(([k, label], i) => {
    const c = el('circle', { cx: pts[i][0], cy: pts[i][1], r: 6, fill: m.colour }, g);
    const hit = el('circle', { cx: pts[i][0], cy: pts[i][1], r: 14, fill: 'transparent' }, g);
    const show = (e) => { tip.innerHTML = `<b>${esc(m.name)}</b> · ${esc(label)}<br>${m.values[k] == null ? 'not built' : m.values[k] + '%'} · ${esc(m.notes[k] || '')}`; tip.style.display = 'block'; tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; };
    hit.addEventListener('mousemove', show); hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  });
});
// the legend names each model and dims the others while it is hovered or focused
const legend = document.getElementById('legend');
Object.entries(D.models).forEach(([id, m]) => {
  const li = document.createElement('li');
  li.innerHTML = `<button type="button"><span class="sw" style="border-color:${m.colour}"></span><b>${esc(m.name)}</b><span class="m">${m.minutes != null ? 'median ' + m.minutes + ' min per build' : 'built in Claude Code, not timed'}</span></button>`;
  const b = li.querySelector('button');
  const on = () => Object.entries(groups).forEach(([k, g]) => g.classList.toggle('dim', k !== id));
  const off = () => Object.values(groups).forEach((g) => g.classList.remove('dim'));
  b.addEventListener('mouseenter', on); b.addEventListener('focus', on); b.addEventListener('mouseleave', off); b.addEventListener('blur', off);
  legend.append(li);
});
document.getElementById('finds').innerHTML = (D.findings || []).map((f) => `<li>${f}</li>`).join('');
document.getElementById('source').innerHTML = D.source || '';
document.getElementById('table').innerHTML = `<caption class="kicker" style="text-align:left">Share of checks passed by the best first build</caption><tr><th scope="col">Task</th>${Object.values(D.models).map((m) => `<th scope="col">${esc(m.name)}</th>`).join('')}</tr>` +
  D.axes.map(([k, label]) => `<tr><th scope="row">${esc(label)}</th>${Object.values(D.models).map((m) => `<td class="n" title="${esc(m.notes[k] || '')}">${m.values[k] == null ? '–' : m.values[k] + '%'}</td>`).join('')}</tr>`).join('');
</script>
</body>
</html>
