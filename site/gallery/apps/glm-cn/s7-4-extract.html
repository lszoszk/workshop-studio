<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraphs out of a UN document</title>
<style>
  :root{
    --paper:#f4f0e8; --ink:#1d1b18; --rule:#d9d2c3; --accent:#9b2335;
    --green:#1d6b3c; --mono:ui-monospace,Menlo,Consolas,monospace;
    --serif:Georgia,"Times New Roman",serif; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--sans)}
  a{color:var(--accent)}
  a:focus,button:focus{outline:2px solid var(--accent);outline-offset:2px}
  /* header */
  header{border-bottom:1px solid var(--rule);padding:14px 20px 10px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:flex-end;justify-content:space-between}
  .dlabel{font:11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6b6355}
  header h1{font:400 26px/1.15 var(--serif);margin:4px 0 2px;max-width:60ch}
  .meta{font:13px/1.4 var(--sans);color:#4d473c}
  .header-status{text-align:right;font:12px/1.5 var(--mono)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:5px}
  .dot.ok{background:var(--green)} .dot.bad{background:var(--accent)}
  .src-limit{color:var(--accent)}
  /* tabs */
  nav[role="tablist"]{display:flex;gap:0;border-bottom:1px solid var(--rule);padding:0 20px}
  .tab{background:none;border:none;border-bottom:3px solid transparent;font:12px var(--mono);letter-spacing:.1em;padding:10px 18px 8px;cursor:pointer;color:#4d473c}
  .tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
  /* layout */
  .layout{display:flex;min-height:60vh}
  aside{width:250px;flex:0 0 250px;border-right:1px solid var(--rule);padding:18px 20px}
  main{flex:1;padding:20px 26px;min-width:0}
  .rail-h{font:11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#6b6355;margin:0 0 6px}
  .doc-card{border-top:2px solid var(--ink);padding:8px 0 12px;border-bottom:1px solid var(--rule);margin-bottom:14px}
  .doc-card .sym{font:13px var(--mono)}
  .doc-card .st{font:13px/1.3 var(--sans);color:#4d473c}
  .big{font:400 44px/1 var(--serif);margin:12px 0 2px}
  .big small{font-size:18px;color:#4d473c}
  .big.bad{color:var(--accent)}
  .bar{height:4px;background:var(--rule);margin:6px 0 2px;position:relative}
  .bar>span{position:absolute;left:0;top:0;bottom:0;background:var(--green)}
  .bar.bad>span{background:var(--accent)}
  .rail-note{font:12px/1.4 var(--sans);color:#4d473c}
  .rail-check{margin-top:14px;font:13px var(--sans)}
  /* tiles */
  .tiles{display:flex;flex-wrap:wrap;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:22px}
  .tile{background:var(--paper);padding:14px 18px 10px;flex:1 1 200px;min-width:190px}
  .tile .tlabel{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:#6b6355}
  .tile .num{font:400 46px/1.1 var(--serif);margin:4px 0}
  .tile .num.bad{color:var(--accent)}
  .tile .num.good{color:var(--green)}
  .tile .num small{font-size:18px;color:#4d473c}
  .tile .how{font:12px/1.4 var(--sans);color:#4d473c;margin-top:2px}
  /* mismatch list */
  .mm-list{margin:0 0 20px;padding:0;list-style:none;border-top:1px solid var(--rule)}
  .mm-list li{padding:7px 0;border-bottom:1px solid var(--rule);font:14px/1.45 var(--sans)}
  .mm-list .pno{font:12px var(--mono);color:var(--accent);margin-right:8px}
  .mm-list .found{color:#4d473c}
  .mm-list .ref{color:#4d473c}
  .mm-list .arrow{color:#6b6355;margin:0 6px}
  .more-line{font:12px var(--mono);color:#6b6355}
  /* export */
  .export-box{border-top:2px solid var(--ink);padding:12px 0 18px;margin-bottom:10px}
  .export-box h2{font:400 22px var(--serif);margin:0 0 6px}
  .btn{background:var(--ink);color:var(--paper);border:none;font:13px var(--mono);letter-spacing:.06em;padding:9px 16px;cursor:pointer;margin-right:10px;margin-top:6px}
  .btn[disabled]{background:#9a917f;cursor:not-allowed}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
  /* disclosure */
  .disc{border:none;border-top:1px solid var(--rule);background:none;width:100%;text-align:left;font:13px var(--mono);letter-spacing:.08em;padding:12px 0;cursor:pointer;color:var(--ink)}
  .disc::before{content:"+ "} .disc[aria-expanded="true"]::before{content:"− "}
  .disc-panel{padding:0 0 16px}
  /* tables */
  table{border-collapse:collapse;width:100%;margin:6px 0 14px}
  caption{caption-side:top;text-align:left;font:400 19px var(--serif);padding:6px 0 10px}
  caption .tno{font:11px var(--mono);letter-spacing:.1em;color:#6b6355;display:block;margin-bottom:2px}
  th{font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;text-align:left;border-bottom:2px solid var(--ink);padding:6px 10px 6px 0;font-weight:700}
  th.r,td.r{text-align:right}
  td{border-bottom:1px solid var(--rule);padding:7px 10px 7px 0;vertical-align:top;font:14px/1.45 var(--sans)}
  td.pno,th.pno{font:12px var(--mono);color:var(--accent)}
  .ok-tag{color:var(--green);font:12px var(--mono)}
  .bad-tag{color:var(--accent);font:12px var(--mono)}
  .note-line{font:13px/1.5 var(--sans);color:#4d473c;margin:6px 0 14px}
  .rule-counts{font:12px var(--mono);color:#4d473c;margin:4px 0 8px}
  .rowbtn{background:none;border:none;border-bottom:1px solid var(--rule);width:100%;display:grid;grid-template-columns:52px minmax(0,1.1fr) minmax(0,2fr) 110px;gap:10px;text-align:left;padding:7px 0;cursor:pointer;font:14px/1.45 var(--sans);color:var(--ink);align-items:start}
  .rowbtn:hover{background:#ece6d9}
  .rowbtn .c1{font:12px var(--mono);color:var(--accent)}
  .rowbtn .c2{color:#4d473c}
  .rowbtn .c3{color:var(--ink)}
  .detail{border-left:3px solid var(--rule);margin:0 0 14px 24px;padding:8px 14px}
  .detail .full{font:15px/1.6 var(--sans);white-space:pre-wrap}
  .detail .fw{margin:10px 0 4px;font:12px var(--mono);color:#6b6355}
  .detail .fw .bad{color:var(--accent)}
  .detail .fw .good{color:var(--green)}
  .mark{border:1px solid var(--accent);padding:0 1px}
  .copy-btn{background:none;border:1px solid var(--ink);font:12px var(--mono);padding:5px 10px;cursor:pointer;margin-top:10px}
  .headings-box{border:1px solid var(--rule);padding:10px 14px;margin-bottom:14px}
  /* checks */
  .check-line{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid var(--rule);font:14px/1.45 var(--sans);flex-wrap:wrap}
  .check-line .cname{min-width:150px;font-weight:600}
  .check-line .cvals{color:#4d473c;flex:1;min-width:200px}
  .tag-pass{color:var(--green);font:12px var(--mono)}
  .tag-fail{color:var(--accent);font:12px var(--mono)}
  .tag-limit{color:var(--accent);font:12px var(--mono)}
  .tag-notrun{color:#6b6355;font:12px var(--mono)}
  footer{border-top:1px solid var(--rule);padding:12px 20px;font:12px/1.5 var(--mono);color:#4d473c;display:flex;gap:24px;flex-wrap:wrap}
  .hint{font:11px/1.4 var(--mono);color:#6b6355;margin-left:6px}
  @media (max-width:760px){aside{display:none}.rowbtn{grid-template-columns:44px 1fr 90px}.rowbtn .c2{display:none}}
</style>
</head>
<body>

<header>
  <div>
    <div class="dlabel">UN DOCUMENT · HTML</div>
    <h1 id="h-title"></h1>
    <div class="meta" id="h-meta"></div>
  </div>
  <div class="header-status" id="h-status"></div>
</header>

<nav role="tablist" aria-label="Sections">
  <button class="tab" role="tab" id="tab1" aria-selected="true" aria-controls="panel1">01 RESULT</button>
  <button class="tab" role="tab" id="tab2" aria-selected="false" aria-controls="panel2" tabindex="-1">02 PARAGRAPHS</button>
</nav>

<div class="layout">
  <aside id="rail" aria-label="Document summary"></aside>
  <main>
    <section id="panel1" role="tabpanel" aria-labelledby="tab1"></section>
    <section id="panel2" role="tabpanel" aria-labelledby="tab2" hidden></section>
  </main>
</div>

<footer id="foot"></footer>

<script>
(function(){
  const D = window.WORKSHOP_DATA && window.WORKSHOP_DATA.html_doc;
  const S = {symbol:"—", title:"No document", doc_url:"", source:"", built:"", ref:null, paras:[], headings:[], repairs:[], checks:[], committee:"", titleHeading:"", unclassified:[], glueLabels:0, haveHtml:false};

  /* ---------- pipeline ---------- */
  function normalise(s){
    return s.replace(/\u201c|\u201d/g,'"').replace(/\u2018|\u2019/g,"'")
            .replace(/\u2013/g,"-").replace(/\u2011/g,"-")
            .replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
  }
  function cleanText(s){ return s.replace(/\s+/g," ").trim(); }

  function run(){
    if(!D || typeof D.html !== "string"){ return; }
    S.haveHtml = true;
    S.symbol = D.symbol || "—";
    S.title = D.title || "Untitled document";
    S.doc_url = D.doc_url || "";
    S.source = D.source || "";
    S.built = D.built || "";
    S.ref = (D.reference && typeof D.reference === "object") ? D.reference : null;

    const doc = new DOMParser().parseFromString(D.html, "text/html");
    const els = doc.body.querySelectorAll("table, p, h2, h3");
    let coverDone = false;
    let roman = null, section = null;

    els.forEach(el=>{
      const tag = el.tagName.toLowerCase();
      if(tag === "table"){
        if(!coverDone){ coverDone = true; S.classCounts.cover++; return; }
        S.unclassified.push({kind:"table", text:cleanText(el.textContent).slice(0,60)});
        S.classCounts.other++; return;
      }
      const raw = el.textContent || "";
      const text = cleanText(raw);
      if(tag === "p"){
        const m = text.match(/^(\d{1,3})\.\s*(.*)$/s);
        if(m){
          const num = parseInt(m[1],10);
          const rec = {paragraph:num, section, part:roman, text_raw:m[2], text:"", fwMatch:null, repairs:[]};
          repairText(rec);
          S.paras.push(rec);
          S.classCounts.para++; return;
        }
        if(!S.committee && !S.titleHeading){ S.committee = text; S.classCounts.committee++; return; }
        S.unclassified.push({kind:"p", text:text.slice(0,60)});
        S.classCounts.other++; return;
      }
      // h2 / h3
      if(!S.titleHeading){ S.titleHeading = text; S.classCounts.title++; return; }
      const hm = text.match(/^([IVX]+|[A-Z])\.\s*(.+)$/);
      let label=null, heading=text;
      if(hm){ label = hm[1]; heading = hm[2]; S.glueLabels++; }
      const h = {level:tag, label, heading};
      S.headings.push(h);
      if(tag === "h2" && /^[IVX]+$/.test(label || "")){ roman = {label, heading}; }
      section = h;
      S.classCounts.heading++;
    });

    S.paras.sort((a,b)=>a.paragraph-b.paragraph);
    // first words check
    const fw = S.ref && S.ref.first_words;
    S.paras.forEach(p=>{
      if(fw){
        const found = p.text.split(/\s+/).slice(0,6).join(" ");
        p.first_six = found;
        p.ref_six = fw[String(p.paragraph)] || null;
        p.fwMatch = p.ref_six !== null && normalise(found) === normalise(p.ref_six);
      } else { p.fwMatch = null; }
    });
  }
  S.classCounts = {cover:0, para:0, title:0, committee:0, heading:0, other:0};

  function repairText(rec){
    let t = rec.text_raw;
    const rules = [
      {name:"sentence join", re:/([a-z])\.([A-Z])/g, sub:"$1. $2"},
      {name:"comma join",   re:/([a-z]),([A-Za-z])/g, sub:"$1, $2"},
      {name:"quote join",   re:/([a-z])\u201c/g,      sub:"$1 \u201c"},
      {name:"dash join",    re:/\u2013([A-Za-z])/g,   sub:"\u2013 $1"}
    ];
    let out = "";
    rules.forEach(r=>{
      t = t.replace(r.re, (mm, a, b)=>{
        const before = (out ? "" : "") + mm; // context below
        return r.sub.replace("$1", a).replace("$2", b);
      });
    });
    // simpler: redo with logging
    t = rec.text_raw;
    const log = [];
    rules.forEach(r=>{
      t = t.replace(r.re, function(mm, g1, g2){
        const idx = arguments[arguments.length-2]; // offset
        const ctx = rec.text_raw.slice(Math.max(0,idx-20), Math.min(rec.text_raw.length, idx+mm.length+20));
        log.push({rule:r.name, context:ctx});
        return (g1!==undefined?g1:"") + (r.sub.includes("$1. $2")?". ":(r.sub.includes("$1, $2")?", ":(r.sub.includes("$1 \u201c")?" \u201c":"\u2013 "))) + (g2!==undefined?g2:"");
      });
    });
    rec.text = t;
    rec.repairLog = log;
    if(log.length){ S.repairs.push(rec); }
  }

  /* ---------- checks ---------- */
  function buildChecks(){
    const C = S.checks; const ref = S.ref;
    const pass = v=>v?"pass":"check failed";
    // paragraph count
    const exp = ref && typeof ref.paragraphs === "number" ? ref.paragraphs : null;
    C.push({name:"Paragraph count", vals: S.paras.length + " found" + (exp!==null ? " / " + exp + " expected" : ""), state: exp===null?"notrun":(S.paras.length===exp?"pass":"fail"), failIds:"count"});
    // numbering
    const nums = S.paras.map(p=>p.paragraph);
    const gaps=[], dups=[];
    const seen = new Set();
    nums.forEach(n=>{ if(seen.has(n)) dups.push(n); seen.add(n); });
    for(let i=1;i<=nums.length;i++){ if(!seen.has(i)) gaps.push(i); }
    const orderOk = nums.every((n,i)=>i===0||n>nums[i-1]);
    C.push({name:"Numbering", vals: orderOk && !gaps.length && !dups.length ? "1 to " + nums.length + " in order, no gaps or duplicates" : ("out of order: " + orderOk + "; gaps: " + (gaps.join(", ")||"none") + "; duplicates: " + (dups.join(", ")||"none")), state:(orderOk && !gaps.length && !dups.length)?"pass":"fail", failIds:"numbering"});
    // first words
    if(ref && ref.first_words){
      const bad = S.paras.filter(p=>p.fwMatch===false);
      C.push({name:"First words", vals: (S.paras.length-bad.length) + " of " + S.paras.length + " paragraphs match the reference's first six words", state: bad.length?"fail":"pass", failIds:"fw"});
    } else {
      C.push({name:"First words", vals:"no first_words in the reference", state:"notrun"});
    }
    // footnotes
    const fn = ref && typeof ref.footnotes === "number" ? ref.footnotes : null;
    if(fn!==null){
      C.push({name:"Footnotes", vals: "0 found / " + fn + " in the document — the HTML version has no footnotes: a limit of the source, not of the app", state:"limit"});
    } else {
      C.push({name:"Footnotes", vals:"no footnote count in the reference", state:"notrun"});
    }
    // repairs
    const nrep = S.paras.reduce((a,p)=>a+(p.repairLog?p.repairLog.length:0),0);
    const npar = S.paras.filter(p=>p.repairLog&&p.repairLog.length).length;
    const perRule = {};
    S.paras.forEach(p=>(p.repairLog||[]).forEach(r=>{perRule[r.rule]=(perRule[r.rule]||0)+1;}));
    C.push({name:"Repairs", vals: nrep + " spaces restored in " + npar + " paragraphs (" + Object.keys(perRule).map(k=>perRule[k]+" "+k).join(", ") + "); text_raw keeps the text as found", state:"pass"});
    // headings
    const nH2 = S.headings.filter(h=>h.level==="h2").length, nH3 = S.headings.filter(h=>h.level==="h3").length;
    C.push({name:"Headings", vals: nH2 + " <h2> and " + nH3 + " <h3> found; " + S.glueLabels + " glued labels separated (e.g. \"I.Introduction\")", state:"pass"});
    // nothing lost
    const total = Array.from(new DOMParser().parseFromString(D.html,"text/html").body.querySelectorAll("table, p, h2, h3")).length;
    const sum = S.classCounts.cover+S.classCounts.para+S.classCounts.title+S.classCounts.committee+S.classCounts.heading+S.classCounts.other;
    let vals = "elements: " + total + "; classified: cover " + S.classCounts.cover + ", title " + S.classCounts.title + ", committee " + S.classCounts.committee + ", paragraphs " + S.classCounts.para + ", headings " + S.classCounts.heading + ", unclassified " + S.classCounts.other;
    C.push({name:"Nothing lost", vals, state: (total===sum && S.classCounts.other===0)?"pass":"fail", failIds:"lost"});
    // export round trip
    try{
      const j = JSON.parse(JSON.stringify(exportRecords()));
      C.push({name:"Export round trip", vals: "the JSON export parses back with " + j.length + " records, equal to the " + S.paras.length + " rows in the table", state: j.length===S.paras.length?"pass":"fail"});
    }catch(e){
      C.push({name:"Export round trip", vals:"could not be run: " + e.message, state:"fail"});
    }
  }
  function passCount(){ return S.checks.filter(c=>c.state==="pass").length; }
  function failCount(){ return S.checks.filter(c=>c.state==="fail").length; }
  function limitCount(){ return S.checks.filter(c=>c.state==="limit").length; }

  /* ---------- exports ---------- */
  function citation(p){ return S.symbol + ", para. " + p.paragraph; }
  function exportRecords(){
    return S.paras.map(p=>({
      symbol: S.symbol,
      paragraph: p.paragraph,
      section: p.section ? (p.section.label ? p.section.label + ". " : "") + p.section.heading : null,
      part: p.part ? p.part.label + ". " + p.part.heading : null,
      text: p.text,
      text_raw: p.text_raw,
      first_words_match: p.fwMatch,
      citation: citation(p),
      doc_url: S.doc_url,
      limitations: "no footnotes in this HTML version; the document has " + (S.ref && typeof S.ref.footnotes==="number" ? S.ref.footnotes : "an unknown number of") + " footnotes"
    }));
  }
  function safeName(){ return String(S.symbol).replace(/\//g,"-"); }
  function download(content, filename, mime){
    const blob = new Blob([content], {type:mime+";charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }
  function markdownExport(){
    const ref = S.ref || {};
    const today = new Date().toISOString().slice(0,10);
    const lines = ["---",
      "title: " + JSON.stringify(S.title),
      "symbol: " + S.symbol,
      "adopted: " + (ref.adopted || "unknown"),
      "source_url: " + S.doc_url,
      "extracted: " + today,
      "paragraphs_found: " + S.paras.length,
      "paragraphs_expected: " + (typeof ref.paragraphs==="number"?ref.paragraphs:"unknown"),
      "footnotes: " + (typeof ref.footnotes==="number" ? "no footnotes in this HTML version; the document has "+ref.footnotes : "footnote count unknown; not in this HTML version"),
      "---",""];
    // headings and paragraphs in document order
    S.headings.forEach(h=>{
      const full = (h.label? h.label+". ":"") + h.heading;
      lines.push(h.level==="h2" ? "## " + full : "### " + full);
      const under = S.paras.filter(p=>p.section===h);
      under.forEach(p=>{ lines.push("**" + p.paragraph + ".** " + p.text); lines.push(""); });
    });
    // paragraphs before the first heading (if any)
    const before = S.paras.filter(p=>!p.section);
    if(before.length){ lines.unshift("", ...before.map(p=>"**"+p.paragraph+".** "+p.text)); }
    return lines.join("\n");
  }

  /* ---------- rendering ---------- */
  const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  function link(url,txt){ return url ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(txt)+'</a>' : esc(txt); }
  function tag(state){
    return state==="pass" ? '<span class="tag-pass">pass</span>'
      : state==="fail" ? '<span class="tag-fail">check failed</span>'
      : state==="limit" ? '<span class="tag-limit">source limit</span>'
      : '<span class="tag-notrun">not run</span>';
  }

  function renderHeader(){
    document.getElementById("h-title").textContent = S.title;
    document.getElementById("h-meta").innerHTML =
      link(S.doc_url, S.symbol) +
      (S.ref && S.ref.adopted ? " · adopted " + esc(S.ref.adopted) : "") +
      (S.source ? " · " + esc(S.source) : "");
    const st = document.getElementById("h-status");
    if(!S.haveHtml){ st.innerHTML = '<span class="dot bad"></span>no document loaded'; return; }
    const p = passCount(), f = failCount(), l = limitCount();
    st.innerHTML = f>0
      ? '<span class="dot bad"></span>' + f + ' check' + (f>1?"s":"") + ' failed'
      : '<span class="dot ok"></span>' + p + ' of ' + S.checks.length + ' checks pass';
    if(l>0){ st.innerHTML += '<br><span class="src-limit">' + l + ' source limit</span>' + (l>1?"s":""); }
  }

  function renderRail(){
    const rail = document.getElementById("rail");
    const ref = S.ref;
    const exp = ref && typeof ref.paragraphs==="number" ? ref.paragraphs : null;
    const fn  = ref && typeof ref.footnotes==="number" ? ref.footnotes : null;
    const n = S.paras.length;
    const pct = exp ? Math.min(100, Math.round(n/exp*100)) : (n?100:0);
    const countBad = exp!==null && n!==exp;
    rail.innerHTML =
      '<p class="rail-h">Document</p>' +
      '<div class="doc-card"><div class="sym">'+esc(S.symbol)+'</div><div class="st">'+esc(S.title)+'</div></div>' +
      '<div class="big'+(countBad?' bad':'')+'">'+n+' <small>paragraphs of '+(exp!==null?exp:'?')+'</small></div>' +
      '<div class="bar'+(countBad?' bad':'')+'"><span style="width:'+pct+'%"></span></div>' +
      '<div class="rail-note">'+(countBad?'found count differs from the reference':'all expected paragraphs found')+'</div>' +
      '<div class="big bad">0 <small>footnotes of '+(fn!==null?fn:'?')+'</small></div>' +
      '<div class="rail-note">not in this HTML</div>' +
      '<div class="rail-check"><strong>'+passCount()+' of '+S.checks.length+' checks pass</strong>'+(failCount()?' · <span style="color:var(--accent)">'+failCount()+' failed</span>':'')+'</div>';
  }

  function markRepairs(p){
    // highlight repaired spots within the full text by re-applying rules with spans
    let html = esc(p.text);
    (p.repairLog||[]).forEach(r=>{
      const ctx = r.context;
      // build the before (raw) and after (fixed) snippets
      let before = ctx, after = ctx;
      if(r.rule==="sentence join"){ after = ctx.replace(/([a-z])\.([A-Z])/,"$1. $2"); }
      if(r.rule==="comma join"){ after = ctx.replace(/([a-z]),([A-Za-z])/,"$1, $2"); }
      if(r.rule==="quote join"){ after = ctx.replace(/([a-z])\u201c/,"$1 \u201c"); }
      if(r.rule==="dash join"){ after = ctx.replace(/\u2013([A-Za-z])/,"\u2013 $1"); }
      if(before!==after){
        const a = esc(after);
        html = html.split(a).join('<span class="mark">'+a+'</span>');
      }
    });
    return html;
  }

  function renderTab1(){
    const el = document.getElementById("panel1");
    const ref = S.ref;
    const exp = ref && typeof ref.paragraphs==="number" ? ref.paragraphs : null;
    const fn  = ref && typeof ref.footnotes==="number" ? ref.footnotes : null;
    if(!S.haveHtml){
      el.innerHTML = '<p class="note-line">This file has no HTML document to read. Nothing can be extracted.</p>';
      return;
    }
    if(!S.paras.length){
      el.innerHTML = '<p class="note-line">No numbered paragraphs were found in this HTML. The exports are disabled.</p>';
    }
    const fwTotal = S.paras.filter(p=>p.fwMatch===true).length;
    const fwBad = S.paras.filter(p=>p.fwMatch===false);
    const nrep = S.paras.reduce((a,p)=>a+(p.repairLog?p.repairLog.length:0),0);
    const nrepp = S.paras.filter(p=>p.repairLog&&p.repairLog.length).length;
    const perRule = {};
    S.paras.forEach(p=>(p.repairLog||[]).forEach(r=>{perRule[r.rule]=(perRule[r.rule]||0)+1;}));

    let html = '<div class="tiles">';
    // paragraphs
    html += '<div class="tile"><div class="tlabel">Paragraphs found</div><div class="num '+(exp===null?'':(S.paras.length===exp?'good':'bad'))+'">'+S.paras.length+
      (exp!==null?' <small>of '+exp+' expected'+(S.paras.length!==exp?' (difference '+(S.paras.length-exp)+')':'')+'</small>':' <small>no reference in this file</small>')+
      '</div><div class="how">How: a &lt;p&gt; whose text starts "n." is a numbered paragraph; counted by this page\u2019s code.</div></div>';
    // first words
    html += '<div class="tile"><div class="tlabel">First words match</div><div class="num '+(fwBad.length?'bad':'good')+'">'+fwTotal+
      (exp!==null?' <small>of '+exp+'</small>':'')+'</div><div class="how">How: the first six words of each paragraph against reference.first_words, after normalising quotes, dashes and spaces.</div></div>';
    // footnotes
    html += '<div class="tile"><div class="tlabel">Footnotes</div><div class="num bad">0'+(fn!==null?' <small>of '+fn+'</small>':'')+'</div><div class="how">This HTML version has none: no footnote text, no footnote marks. To cite a footnote, use the PDF or Word version.</div></div>';
    // spaces
    html += '<div class="tile"><div class="tlabel">Spaces</div><div class="num">'+nrep+' <small>restored in '+nrepp+' paragraphs</small></div><div class="how">How: a space is inserted only after a full stop, comma, opening quote or en dash where the characters prove one was there. text_raw keeps the text as found.</div></div>';
    html += '</div>';

    // mismatch list
    if(fwBad.length){
      html += '<p class="rail-h" style="margin-top:0">First words differ in '+fwBad.length+' paragraph'+(fwBad.length>1?'s':'')+'</p><ul class="mm-list">';
      fwBad.slice(0,10).forEach(p=>{
        html += '<li><span class="pno">para. '+p.paragraph+'</span><span class="found">found \u201c'+esc(p.first_six)+'\u2026\u201d</span><span class="arrow">\u2192</span><span class="ref">reference \u201c'+esc(p.ref_six)+'\u2026\u201d</span></li>';
      });
      html += '</ul>';
      if(fwBad.length>10){ html += '<p class="more-line">and '+(fwBad.length-10)+' more \u2014 see tab 02, rows flagged \u201cfirst words differ\u201d</p>'; }
    }

    // export
    html += '<div class="export-box"><h2>Take the paragraphs away</h2>'+
      '<p class="note-line">Each record carries its symbol, paragraph number, section, text (repaired) and text_raw (as found), citation, doc_url and its known limitations.</p>'+
      '<button class="btn" id="dl-json"'+(S.paras.length?'':' disabled')+'>Download JSON</button>'+
      '<button class="btn ghost" id="dl-md"'+(S.paras.length?'':' disabled')+'>Download Markdown</button></div>';

    // closed: every check
    html += '<button class="disc" aria-expanded="false" aria-controls="checks-panel">Every check ('+S.checks.length+')</button>'+
      '<div class="disc-panel" id="checks-panel" hidden>';
    S.checks.forEach(c=>{
      html += '<div class="check-line"><span class="cname">'+esc(c.name)+'</span><span class="cvals">'+esc(c.vals)+'</span>'+tag(c.state)+'</div>';
    });
    html += '</div>';

    // closed: spaces restored
    html += '<button class="disc" aria-expanded="false" aria-controls="spaces-panel">The spaces restored ('+nrep+')</button>'+
      '<div class="disc-panel" id="spaces-panel" hidden>';
    if(nrep){
      html += '<p class="rule-counts">'+Object.keys(perRule).map(k=>perRule[k]+' \u00d7 '+k).join(' · ')+'</p>'+
        '<table><caption><span class="tno">TAB.01</span>'+nrep+' spaces restored, in '+nrepp+' paragraphs</caption>'+
        '<thead><tr><th scope="col">Paragraph</th><th scope="col">Before</th><th scope="col">After</th><th scope="col">Rule</th></tr></thead><tbody>';
      S.paras.forEach(p=>(p.repairLog||[]).forEach(r=>{
        let before = r.context, after = r.context;
        if(r.rule==="sentence join"){ after = r.context.replace(/([a-z])\.([A-Z])/,"$1. $2"); }
        if(r.rule==="comma join"){ after = r.context.replace(/([a-z]),([A-Za-z])/,"$1, $2"); }
        if(r.rule==="quote join"){ after = r.context.replace(/([a-z])\u201c/,"$1 \u201c"); }
        if(r.rule==="dash join"){ after = r.context.replace(/\u2013([A-Za-z])/,"\u2013 $1"); }
        html += '<tr><td class="pno r">'+p.paragraph+'</td><td>'+esc(before)+'</td><td>'+esc(after)+'</td><td>'+esc(r.rule)+'</td></tr>';
      }));
      html += '</tbody></table>';
    } else {
      html += '<p class="note-line">No missing spaces were provable in this document.</p>';
    }
    html += '<p class="note-line">Rules restore a space only where the characters prove it was there. Word pairs such as \u201cGiventhe\u201d are not touched.</p></div>';

    el.innerHTML = html;

    if(S.paras.length){
      document.getElementById("dl-json").addEventListener("click", ()=>{
        download(JSON.stringify(exportRecords(), null, 2), safeName()+".json", "application/json");
      });
      document.getElementById("dl-md").addEventListener("click", ()=>{
        download(markdownExport(), safeName()+".md", "text/markdown");
      });
    }
    // disclose panels
    bindDisc(document.getElementById("checks-panel"));
    bindDisc(document.getElementById("spaces-panel"));
    // rows in spaces table jump to tab 02? plan: clicking a row opens the paragraph on tab 02
    const rows = document.querySelectorAll("#spaces-panel tbody tr");
    rows.forEach((tr,i)=>{
      tr.style.cursor="pointer";
      tr.addEventListener("click", ()=>{
        // find paragraph: iterate same order as built
        const pairs=[]; S.paras.forEach(p=>(p.repairLog||[]).forEach(()=>pairs.push(p)));
        const target = pairs[i];
        selectTab(1);
        openRow(target.paragraph);
      });
    });
  }

  function bindDisc(panel){
    const btn = document.querySelector('[aria-controls="'+panel.id+'"]');
    btn.addEventListener("click", ()=>{
      const open = btn.getAttribute("aria-expanded")==="true";
      btn.setAttribute("aria-expanded", String(!open));
      panel.hidden = open;
    });
  }

  function firstLine(t){
    if(t.length<=120) return t;
    const cut = t.slice(0,120);
    const sp = cut.lastIndexOf(" ");
    return (sp>60?cut.slice(0,sp):cut) + "\u2026";
  }
  function sectionShort(p){
    return p.section ? (p.section.label ? p.section.label + ". " : "") + p.section.heading : "\u2014";
  }
  function sectionFull(p){
    const a = p.part ? p.part.label + ". " + p.part.heading : null;
    const b = sectionShort(p);
    if(a && p.section && p.part && p.section !== p.part){ return a + " \u203a " + b; }
    if(a && !p.section){ return a; }
    if(!p.section && !p.part){ return "\u2014"; }
    if(a && p.section && (p.section.level==="h3" || p.section!==p.part)){ return a + " \u203a " + b; }
    return b;
  }

  function renderTab2(){
    const el = document.getElementById("panel2");
    if(!S.paras.length){
      el.innerHTML = '<p class="note-line">No numbered paragraphs were found in this HTML.</p>';
      return;
    }
    let html = '<div class="headings-box"><button class="disc" aria-expanded="false" aria-controls="headings-list" style="border-top:none;padding-top:0">Headings found: '+S.headings.length+'</button><div id="headings-list" hidden><ul style="margin:6px 0 0;padding-left:18px;font-size:14px">';
    S.headings.forEach(h=>{
      html += '<li>'+esc((h.label?h.label+". ":"")+h.heading)+' <span class="hint">'+(h.level==="h2"?"part":"section")+'</span></li>';
    });
    html += '</ul></div></div>';

    html += '<table><caption><span class="tno">TAB.02</span>'+S.paras.length+' numbered paragraphs, '+S.headings.length+' headings between them</caption>'+
      '<thead><tr><th scope="col" class="r" style="width:52px">No.</th><th scope="col">Section</th><th scope="col">First line</th><th scope="col" style="width:120px">Check</th></tr></thead></table>'+
      '<div id="rows"></div>';
    el.innerHTML = html;
    bindDisc(document.getElementById("headings-list"));

    const rowsEl = document.getElementById("rows");
    S.paras.forEach(p=>{
      const btn = document.createElement("button");
      btn.className = "rowbtn";
      btn.setAttribute("aria-expanded","false");
      btn.dataset.para = p.paragraph;
      btn.innerHTML = '<span class="c1">'+p.paragraph+'</span><span class="c2">'+esc(sectionShort(p))+'</span><span class="c3">'+esc(firstLine(p.text))+'</span>'+
        (p.fwMatch===false ? '<span class="bad-tag">first words differ</span>' : p.fwMatch===true ? '<span class="ok-tag">OK</span>' : '<span class="tag-notrun">not run</span>');
      const detail = document.createElement("div");
      detail.className = "detail"; detail.hidden = true;
      let d = '<div class="fw">SECTION \u00b7 '+esc(sectionFull(p))+'</div>';
      d += '<div class="full">'+markRepairs(p)+'</div>';
      if(S.ref && S.ref.first_words){
        d += '<div class="fw">first six words \u00b7 found <span class="'+(p.fwMatch?'good':'bad')+'">\u201c'+esc(p.first_six)+'\u201d</span>'+(p.ref_six!==null?' \u00b7 reference <span class="'+(p.fwMatch?'good':'bad')+'">\u201c'+esc(p.ref_six)+'\u201d</span>':'')+'</div>';
      }
      if(p.repairLog && p.repairLog.length){
        d += '<div class="fw">'+p.repairLog.length+' missing space'+(p.repairLog.length>1?'s':'')+' marked <span class="mark">thus</span> in the text above</div>';
      }
      d += '<button class="copy-btn" data-cite="'+esc(citation(p))+'">Copy citation</button> <span class="hint">'+esc(citation(p))+'</span> <span class="hint">'+link(S.doc_url,S.symbol)+'</span>';
      detail.innerHTML = d;
      btn.addEventListener("click", ()=>{
        const open = btn.getAttribute("aria-expanded")==="true";
        btn.setAttribute("aria-expanded", String(!open));
        detail.hidden = open;
      });
      rowsEl.appendChild(btn);
      rowsEl.appendChild(detail);
    });
    // copy buttons
    el.addEventListener("click", e=>{
      const b = e.target.closest(".copy-btn");
      if(!b) return;
      const text = b.getAttribute("data-cite");
      const done = ()=>{
        const old = b.textContent; b.textContent = "Copied";
        setTimeout(()=>{ b.textContent = old; }, 2000);
      };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(done, done);
      } else {
        const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta);
        ta.select(); try{document.execCommand("copy");}catch(_){}
        ta.remove(); done();
      }
    });
  }

  function openRow(num){
    const btn = document.querySelector('.rowbtn[data-para="'+num+'"]');
    if(!btn) return;
    if(btn.getAttribute("aria-expanded")!=="true"){ btn.click(); }
    btn.scrollIntoView({block:"center"});
  }

  /* ---------- tabs ---------- */
  const tabs = [document.getElementById("tab1"), document.getElementById("tab2")];
  const panels = [document.getElementById("panel1"), document.getElementById("panel2")];
  function selectTab(i){
    tabs.forEach((t,j)=>{
      t.setAttribute("aria-selected", String(i===j));
      t.tabIndex = i===j ? 0 : -1;
      panels[j].hidden = i!==j;
    });
  }
  tabs.forEach((t,i)=>{
    t.addEventListener("click", ()=>selectTab(i));
    t.addEventListener("keydown", e=>{
      let k = null;
      if(e.key==="ArrowRight") k=(i+1)%tabs.length;
      if(e.key==="ArrowLeft") k=(i-1+tabs.length)%tabs.length;
      if(k!==null){ e.preventDefault(); selectTab(k); tabs[k].focus(); }
    });
  });

  /* ---------- footer ---------- */
  function renderFoot(){
    document.getElementById("foot").innerHTML =
      (S.source? esc(S.source)+" · ":"") +
      (S.built? "built "+esc(S.built)+" · ":"") +
      "Done by this page\u2019s code; no model was called and nothing left the browser.";
  }

  /* ---------- go ---------- */
  run();
  buildChecks();
  renderHeader();
  renderRail();
  renderTab1();
  renderTab2();
  renderFoot();
})();
</script>
</body>
</html>
