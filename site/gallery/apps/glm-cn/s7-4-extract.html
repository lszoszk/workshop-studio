<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paragraphs out of a PDF — General Comment</title>
<style>
:root{
  --paper:#f4f0e8;--ink:#1d1b18;--rule:#d9d2c3;--accent:#9b2335;--green:#1e6b3a;
  --mono:ui-monospace,Menlo,Consolas,monospace;--serif:Georgia,"Times New Roman",serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",system-ui,sans-serif}
a{color:var(--accent)}
a:focus,button:focus,tr:focus{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#5c5648}
.serif{font-family:var(--serif)}
/* header */
header.top{border-bottom:1px solid var(--rule);padding:14px 26px 12px;display:flex;justify-content:space-between;gap:24px;align-items:flex-start;flex-wrap:wrap}
header.top h1{font-family:var(--serif);font-size:24px;margin:2px 0 4px;font-weight:600}
.metaline{font-size:13.5px;color:#4c463b}
.metaline a{text-decoration:none;border-bottom:1px solid var(--rule)}
.statusline{font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-align:right;padding-top:6px;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:baseline}
.dot.ok{background:var(--green)}
.dot.bad{background:var(--accent)}
/* tabs */
nav.tabs{display:flex;gap:0;border-bottom:1px solid var(--rule);padding:0 26px}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:10px 18px 8px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:#5c5648}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
/* layout */
.wrap{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:60vh}
aside.rail{border-right:1px solid var(--rule);padding:18px 22px}
main{padding:20px 28px 60px;min-width:0}
/* rail */
.railcard{border:1px solid var(--rule);padding:12px 14px;margin-bottom:20px}
.railcard .sym{font-family:var(--mono);font-size:13px;letter-spacing:.05em}
.railcard .ttl{font-family:var(--serif);font-size:14.5px;margin-top:6px;line-height:1.35}
.bignum{font-family:var(--serif);font-size:44px;line-height:1.05;margin-top:18px}
.bignum small{font-size:16px;font-family:var(--sans,system-ui);color:#5c5648}
.bignum .of{font-size:17px;color:#5c5648}
.thinbar{height:3px;background:var(--rule);margin-top:8px;position:relative}
.thinbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.thinbar.bad i{background:var(--accent)}
.hint{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:#7a7364;margin-top:6px;text-transform:none}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);margin-bottom:22px}
.tile{background:var(--paper);padding:16px 18px 14px}
.tile .n{font-family:var(--serif);font-size:46px;line-height:1.05}
.tile .n.ok{color:var(--green)}
.tile .n.bad{color:var(--accent)}
.tile .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;color:#5c5648}
.tile .sub{font-size:13.5px;color:#4c463b;margin-top:4px}
.how{font-family:var(--mono);font-size:10.5px;color:#7a7364;margin-top:10px;letter-spacing:.02em}
/* misc */
h2.fig{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:600}
button.btn{background:var(--ink);color:var(--paper);border:none;padding:9px 18px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.12em}
button.btn:disabled{background:#a49b88;cursor:not-allowed}
button.btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
button.disc{background:none;border:none;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);width:100%;text-align:left;padding:10px 2px;cursor:pointer;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink);display:flex;justify-content:space-between}
button.disc:hover{color:var(--accent)}
.mismatch{border:1px solid var(--rule);padding:10px 14px;margin:14px 0;font-size:14px}
.mismatch .row{margin:4px 0}
.check-line{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--rule);font-size:14.5px;flex-wrap:wrap}
.check-line .what{min-width:220px}
.pass{color:var(--green);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.fail{color:var(--accent);font-family:var(--mono);font-size:11px;letter-spacing:.1em}
.note{font-size:13.5px;color:#4c463b;margin:6px 0 10px}
/* tables */
table{border-collapse:collapse;width:100%;font-size:14.5px}
caption{caption-side:top;text-align:left;font-family:var(--serif);font-size:17px;padding:4px 0 10px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:400;color:#5c5648;text-align:left;border-bottom:1px solid var(--rule);padding:6px 10px 6px 0}
td{border-bottom:1px solid var(--rule);padding:7px 10px 7px 0;vertical-align:top}
th.num,td.num{text-align:right}
tr.prow{cursor:pointer}
tr.prow:hover td{background:#ece6d9}
tr.pdetail td{background:#efeade;padding:16px 18px 20px}
.flag{color:var(--accent)}
.okw{color:var(--green);font-family:var(--mono);font-size:11px;letter-spacing:.08em}
.suspect{border:1px solid var(--accent);padding:0 2px}
.ptext{max-width:74ch;line-height:1.65}
.ptext .ln{margin-right:4px}
.pdflines{background:#ece6d9;border:1px solid var(--rule);padding:12px 14px;margin-top:12px;white-space:pre-wrap;font-size:13px;max-width:80ch}
.pdflines .pg{color:var(--accent);font-family:var(--mono);font-size:10px;letter-spacing:.1em}
.chip{display:inline-block;border:1px solid var(--accent);color:var(--accent);font-family:var(--mono);font-size:10.5px;padding:1px 8px;margin:2px 4px 2px 0;letter-spacing:.05em}
.hlist{font-size:14px}
.hlist li{margin:3px 0}
/* footer */
footer{border-top:1px solid var(--rule);padding:12px 26px;font-size:13px;color:#5c5648;display:flex;gap:18px;flex-wrap:wrap}
.copybtn{background:none;border:1px solid var(--ink);padding:4px 12px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.08em;margin-top:10px}
section.panel{margin-bottom:26px}
</style>
</head>
<body>

<header class="top">
  <div style="min-width:0">
    <div class="mono">UN DOCUMENT · PDF TEXT</div>
    <h1 id="h-title"></h1>
    <div class="metaline" id="h-meta"></div>
  </div>
  <div class="statusline" id="h-status"></div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button class="tab" id="tab1" role="tab" aria-controls="panel1" aria-selected="true">01 RESULT</button>
  <button class="tab" id="tab2" role="tab" aria-controls="panel2" aria-selected="false" tabindex="-1">02 PARAGRAPHS</button>
</nav>

<div class="wrap">
  <aside class="rail" id="rail"></aside>
  <main>
    <section id="panel1" role="tabpanel" aria-labelledby="tab1"></section>
    <section id="panel2" role="tabpanel" aria-labelledby="tab2" hidden></section>
  </main>
</div>

<footer id="foot"></footer>

<script>
(function(){
"use strict";
const D = window.WORKSHOP_DATA.pdf_text || {};
const R = D.reference || {};
const SYM = D.symbol || "";
const records = (D.records || []).slice().sort((a,b)=>a.page-b.page);
const hasRef = R && R.paragraphs != null;

/* ---------- line helpers ---------- */
const norm = s => String(s).replace(/[\u2018\u2019]/g,"'").replace(/[\u201C\u201D]/g,'"')
  .replace(/[\u2013\u2014]/g,"-").replace(/\s+/g," ").trim();
const isParaStartNum = t => { const m=t.match(/^(\d{1,3})\. ?(.*)$/); return m ? {num:+m[1], rest:m[2].trim()} : null; };
const isLabel = t => /^([IVX]+|[A-Z])\.$/.test(t);
const isSuspect = t => /^\d{1,3}$/.test(t) || /^\d{1,3} [A-Z\u201C'\u201D"]/.test(t) || /^\* /.test(t);
function suspectWhy(t){
  if(/^\d{1,3}$/.test(t)) return "bare number";
  if(/^\* /.test(t)) return "asterisk note";
  return "starts with a number and a space";
}
function unlabelledCandidate(t){
  return t && t.length<=90 && /^[A-Z]/.test(t) && !/[.;:,\d]$/.test(t);
}
function firstWords(text,n){
  n = n||6;
  const toks = text.split(/\s+/).filter(Boolean);
  const out = [];
  for(let i=0;i<toks.length && out.length<n;i++){
    const t = toks[i];
    if(/^\d+$/.test(t)){
      const prev = out.length ? out[out.length-1] : null;
      if(prev && /[.,;\u201D"')]/.test(prev.slice(-1)) && !/\b(no|art|para|vol|chap)\.$/i.test(prev)) continue;
      out.push(t); continue;
    }
    const c = t.replace(/\d+$/,"");
    if(c) out.push(c);
  }
  return out.join(" ");
}

/* ---------- pipeline ---------- */
const lines = [];           // {page,t(raw),kind,...}
const pageStats = [];
let totalNonEmpty = 0;

for(const rec of records){
  const raw = String(rec.text==null?"":rec.text).split(/\r?\n/);
  const firstIdx = raw.findIndex(l=>l.trim()!=="");
  const headerOk = firstIdx>=0 && raw[firstIdx].trim()===SYM;
  // footer
  let end = raw.length-1, pageNumberFound=false; const bare=[];
  while(end>=0){
    const t = raw[end].trim();
    if(t===""){end--;continue;}
    if(t.indexOf("GE.")===0){end--;continue;}
    if(/^\d{6}(\s+\d{6})*$/.test(t)){end--;continue;}
    if(/^\d{1,3}$/.test(t)){
      if(+t===rec.page) pageNumberFound=true; else bare.push({page:rec.page,value:+t});
      end--;continue;
    }
    break;
  }
  let nNonEmpty = 0;
  for(let i=0;i<raw.length;i++) if(raw[i].trim()!=="") nNonEmpty++;
  totalNonEmpty += nNonEmpty;
  const bodyStart = headerOk ? firstIdx+1 : firstIdx;
  for(let i=bodyStart;i<=end;i++){
    const t = raw[i].trim();
    lines.push({page:rec.page, t:t, kind:null, suspect:false});
  }
  pageStats.push({page:rec.page, headerOk, pageNumberFound, bare, headerLine: headerOk?null:raw[firstIdx].trim()});
}

/* classification pass */
const headings = [];
let headingCollect = false, curHead = null;
let inPara = false;

function headingAt(idx){ headings.push({idx:idx}); return headings[headings.length-1]; }

for(let j=0;j<lines.length;j++){
  const L = lines[j];
  if(!L.t) continue;
  const ps = isParaStartNum(L.t);
  if(ps && (L.t.match(/^\d{1,3}\.$/) || L.t.match(/^\d{1,3}\. \S/))){
    headingCollect = false; curHead = null; inPara = true;
    L.kind = "paragraph"; L.paraStart = ps.num;
    if(ps.rest) L.firstText = ps.rest;
    continue;
  }
  if(isLabel(L.t)){
    headingCollect = true; inPara = false;
    L.kind = "heading";
    curHead = headingAt(j);
    curHead.label = L.t;
    curHead.type = /^[IVX]+\.$/.test(L.t) ? "roman" : "letter";
    curHead.textLines = [];
    continue;
  }
  if(headingCollect){
    L.kind = "heading";
    if(curHead) curHead.textLines.push(L.t);
    continue;
  }
  // unlabelled heading: next non-empty line is a paragraph start
  let k = j+1;
  while(k<lines.length && !lines[k].t) k++;
  const nextIsStart = k<lines.length && lines[k].paraStart!==undefined ? false : // not yet classified
    (k<lines.length && isParaStartNum(lines[k].t) && (lines[k].t.match(/^\d{1,3}\.$/) || lines[k].t.match(/^\d{1,3}\. \S/)));
  if(k<lines.length && isParaStartNum(lines[k].t) && (lines[k].t.match(/^\d{1,3}\.$/) || lines[k].t.match(/^\d{1,3}\. \S/)) && unlabelledCandidate(L.t)){
    // check previous line
    let h = [L.t];
    if(j>0 && lines[j-1].t && unlabelledCandidate(lines[j-1].t) && !/[.?!;:,\u2026\u201D"'\u2019)\d]$/.test(lines[j-1].t)){
      lines[j-1].kind = "heading";
      h.unshift(lines[j-1].t);
      const hh = headingAt(j-1); hh.type="unlabelled"; hh.textLines=h.slice();
    }
    L.kind = "heading"; inPara = false;
    const hh2 = headingAt(j); hh2.type="unlabelled"; hh2.textLines=h;
    continue;
  }
  if(inPara){ L.kind = "paragraph"; continue; }
  L.kind = "cover";
}
// resolve labelled heading text
for(const h of headings){
  if(h.type && h.type!=="unlabelled"){
    h.text = (h.label + " " + (h.textLines||[]).join(" ")).trim();
  } else {
    h.text = (h.textLines||[]).join(" ");
  }
}

/* build paragraphs */
const paras = [];
let cur = null;
for(let j=0;j<lines.length;j++){
  const L = lines[j];
  if(!L.t || L.kind!=="paragraph") continue;
  if(L.paraStart!==undefined){
    cur = {num:L.paraStart, startIdx:j, lines:[]};
    if(L.firstText) cur.lines.push({page:L.page, t:L.firstText});
    paras.push(cur);
  } else if(cur){
    cur.lines.push({page:L.page, t:L.t});
  }
}
for(const p of paras){
  const hs = headings.filter(h=>h.idx < p.startIdx);
  p.section = hs.length ? hs[hs.length-1].text : "";
  const romans = hs.filter(h=>h.type==="roman");
  p.part = romans.length ? romans[romans.length-1].text : "";
  p.page_start = p.lines.length ? p.lines[0].page : null;
  p.page_end = p.lines.length ? p.lines[p.lines.length-1].page : null;
  p.text = p.lines.map(l=>l.t).join(" ").replace(/ {2,}/g," ").trim();
  p.text_raw = p.lines.map(l=>l.t).join(" | ");
  p.words = p.text.split(/\s+/).filter(Boolean).length;
  // suspect lines
  p.suspectCount = 0; p.reasons = []; let susPage = null;
  for(const ln of p.lines){
    let s = isSuspect(ln.t);
    if(susPage===ln.page) s = true;
    if(s){
      if(susPage===null){ susPage = ln.page; p.reasons.push(suspectWhy(ln.t)); }
      p.suspectCount++;
    } else if(susPage!==null && ln.page!==susPage){ susPage = null; }
    ln.suspect = s;
  }
  if(p.words>300) p.reasons.push("paragraph over 300 words");
  p.flagged = p.suspectCount>0 || p.words>300;
  // first words
  p.fw = firstWords(p.text,6);
  p.fwMatch = hasRef && R.first_words ? (norm(p.fw)===norm(R.first_words[String(p.num)]||"")) : null;
}

/* stats */
const foundCount = paras.length;
const refParas = hasRef ? R.paragraphs : null;
const flagged = paras.filter(p=>p.flagged);
const flaggedPages = [...new Set(flagged.map(p=>p.page_start))].length;
const mismatches = paras.filter(p=>p.fwMatch===false);
const susLineTotal = paras.reduce((a,p)=>a+p.suspectCount,0);
const susPages = new Set();
for(const p of paras) for(const ln of p.lines) if(ln.suspect) susPages.add(ln.page);
const hyphenLines = lines.filter(l=>l.t && /-$/.test(l.t)).length;
const unlabelledHeads = headings.filter(h=>h.type==="unlabelled");
const labelledHeads = headings.filter(h=>h.type!=="unlabelled");
// numbering
const numProblems = [];
for(let i=0;i<paras.length;i++){
  if(paras[i].num!==i+1) numProblems.push({num:paras[i].num, page:paras[i].page_start});
}
// nothing lost
const kindCount = {header:0,footer:0,cover:0,heading:0,paragraph:0};
let headerLines = 0, footerLines = 0;
for(const ps of pageStats){
  if(ps.headerOk) headerLines++;
  footerLines += ps.bare.length + (ps.pageNumberFound?1:0);
}
for(const L of lines){ if(!L.t) continue; if(L.kind && kindCount[L.kind]!==undefined) kindCount[L.kind]++; }
const unclassified = lines.filter(l=>l.t && !l.kind);
const classifiedSum = headerLines + footerLines + kindCount.cover + kindCount.heading + kindCount.paragraph;

/* checks */
const checks = [];
function addCheck(what, detail, status, extra){ checks.push({what,detail,status,extra:extra||""}); }
const pagesAll = records.length;
const pagesNoHeader = pageStats.filter(p=>!p.headerOk).map(p=>p.page);
const pagesNoPageNum = pageStats.filter((p,i)=>i>0 && !p.pageNumberFound).map(p=>p.page);
if(hasRef){
  addCheck("Paragraph count", "found "+foundCount+", reference "+refParas, foundCount===refParas?"pass":"fail");
} else addCheck("Paragraph count","no reference in this file","notrun");
addCheck("Numbering", numProblems.length? ("gaps or duplicates: "+numProblems.slice(0,10).map(x=>"para. "+x.num+" (p. "+x.page+")").join(", ")) : "exactly 1 to "+foundCount+" in order", numProblems.length?"fail":"pass");
if(hasRef && R.first_words){
  addCheck("First words", mismatches.length+" of "+refParas+" differ from the reference", mismatches.length?"fail":"pass");
} else addCheck("First words","no reference in this file","notrun");
addCheck("Paragraphs flagged", flagged.length+" paragraphs flagged on "+flaggedPages+" pages, to check against the PDF","pass");
addCheck("Suspect lines", susLineTotal+" suspect lines on "+susPages.size+" pages, in "+paras.filter(p=>p.suspectCount>0).length+" paragraphs; none removed","pass");
addCheck("Headers and footers",
  pageStats.filter(p=>p.headerOk).length+" of "+pagesAll+" pages start with the symbol; "+
  pageStats.filter(p=>p.pageNumberFound).length+" pages show a page number (expected "+(pagesAll-1)+"); "+
  pageStats.reduce((a,p)=>a+p.bare.length,0)+" bare numbers removed from the footer"+
  (pageStats.some(p=>p.bare.length)? " ("+pageStats.filter(p=>p.bare.length).map(p=>"p."+p.page+": "+p.bare.map(b=>b.value).join(", ")).join("; ")+")" : ""),
  (!pagesNoHeader.length && !pagesNoPageNum.length) ? "pass":"fail",
  (pagesNoHeader.length?"pages without the symbol header: "+pagesNoHeader.join(", ")+" ":"")+(pagesNoPageNum.length?(pagesNoHeader.length?"; ":"")+"pages without a page number: "+pagesNoPageNum.join(", "):""));
addCheck("Headings", labelledHeads.length+" labelled and "+unlabelledHeads.length+" unlabelled headings found", "pass",
  unlabelledHeads.length? "unlabelled: "+unlabelledHeads.map(h=>"\u201C"+h.text+"\u201D").join(" · "):"");
addCheck("Line endings", hyphenLines+" body lines end with a hyphen (none are joined)", "pass");
addCheck("Nothing lost", classifiedSum+" of "+totalNonEmpty+" non-empty lines classified (cover "+kindCount.cover+", heading "+kindCount.heading+", paragraph "+kindCount.paragraph+", header "+headerLines+", footer "+footerLines+")",
  (unclassified.length===0 && classifiedSum===totalNonEmpty)?"pass":"fail",
  unclassified.length? "unclassified: "+unclassified.slice(0,6).map(l=>"p."+l.page+" \u201C"+l.t.slice(0,40)+"\u201D").join(" · "):"");
const exportRecords = buildExportRecords();
let roundTrip = false;
try{ roundTrip = JSON.parse(JSON.stringify(exportRecords)).length === paras.length; }catch(e){ roundTrip=false; }
addCheck("Export round trip","the JSON to download parses back to "+paras.length+" records, matching the table", roundTrip?"pass":"fail");

const passCount = checks.filter(c=>c.status==="pass").length;
const failCount = checks.filter(c=>c.status==="fail").length;
const runCount = checks.filter(c=>c.status!=="notrun").length;

function buildExportRecords(){
  return paras.map(p=>({
    symbol: SYM,
    paragraph: p.num,
    section: p.section,
    part: p.part,
    page_start: p.page_start,
    page_end: p.page_end,
    text: p.text,
    text_lines: p.text_raw,
    flagged: p.flagged,
    first_words_match: p.fwMatch,
    citation: SYM+", para. "+p.num,
    doc_url: D.doc_url||"",
    limitations: p.flagged
      ? "footnotes not separated; "+p.suspectCount+" may sit inside this paragraph"
      : "footnotes not separated"
  }));
}

/* ---------- render: header / rail / footer ---------- */
document.getElementById("h-title").textContent = D.title || "Untitled document";
document.getElementById("h-meta").innerHTML =
  (SYM ? '<a href="'+(D.doc_url||"#")+'" target="_blank" rel="noopener">'+esc(SYM)+'</a>' : '')+
  (R.adopted? ' · adopted '+esc(R.adopted):'')+
  ' · '+records.length+' pages · '+esc(D.source||"");
const allOk = failCount===0;
document.getElementById("h-status").innerHTML =
  '<span class="dot '+(allOk?'ok':'bad')+'"></span>'+
  (allOk ? passCount+' of '+runCount+' checks pass' : failCount+' checks failed')+
  '<br><span style="color:#7a7364">'+flagged.length+' paragraphs flagged</span>';

document.getElementById("rail").innerHTML =
 '<div class="mono" style="margin-bottom:8px">DOCUMENT</div>'+
 '<div class="railcard"><div class="sym">'+esc(SYM)+'</div><div class="ttl">'+esc(D.title||"")+'</div></div>'+
 '<div class="bignum '+((hasRef && foundCount!==refParas)||!paras.length?'':'')+'">'+foundCount+
 ' <span class="of">of '+(hasRef?refParas:'?')+'</span></div>'+
 '<div class="hint">paragraphs found'+(hasRef?'':' · no reference in this file')+'</div>'+
 '<div class="thinbar '+(!hasRef||foundCount!==refParas?'bad':'')+'"><i style="width:'+(hasRef?Math.min(100,100*foundCount/refParas):0)+'%"></i></div>'+
 '<div class="bignum" style="color:'+(flagged.length?'var(--accent)':'inherit')+'">'+flagged.length+'</div>'+
 '<div class="hint">paragraphs flagged of '+foundCount+' · footnote text may sit inside: check them against the PDF</div>'+
 '<div class="bignum" style="font-size:32px">'+passCount+' <span class="of">of '+runCount+' checks pass</span></div>';

document.getElementById("foot").innerHTML =
  esc(D.source||"")+(D.built? ' · built '+esc(String(D.built)) : '')+
  ' · Done by this page\u2019s code; no model was called and nothing left the browser.';

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- tabs ---------- */
const tabs=[document.getElementById("tab1"),document.getElementById("tab2")];
const panels=[document.getElementById("panel1"),document.getElementById("panel2")];
function selectTab(i){
  tabs.forEach((t,k)=>{t.setAttribute("aria-selected",k===i?"true":"false");t.tabIndex=k===i?0:-1;});
  panels.forEach((p,k)=>p.hidden = k!==i);
  tabs[i].focus();
}
tabs.forEach((t,i)=>{
  t.addEventListener("click",()=>selectTab(i));
  t.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){e.preventDefault();selectTab((i+1)%2);}
    if(e.key==="ArrowLeft"){e.preventDefault();selectTab((i+1)%2);}
  });
});

/* ---------- panel 1 ---------- */
const p1 = panels[0];
let html = "";
if(!paras.length){
  html += '<div class="note" style="font-size:17px">No numbered paragraphs were found in this file. The exports are disabled.</div>';
} else {
  const cEq = hasRef && foundCount===refParas;
  html += '<div class="tiles">'+
   tile("Paragraphs found", '<span class="n '+(hasRef?(cEq?'ok':'bad'):'')+'">'+foundCount+'</span>',
     hasRef? 'the document has '+refParas+(cEq?'':' · difference '+(foundCount-refParas>0?"+":"")+(foundCount-refParas)) : 'no reference in this file',
     "How this is computed: lines matching a paragraph number alone or with its text, counted.")+
   tile("First words match", '<span class="n '+(hasRef?(mismatches.length?'bad':'ok'):'')+'">'+(hasRef?(refParas-mismatches.length):'\u2013')+'</span>',
     hasRef? 'of '+refParas+' expected' : 'no reference in this file',
     "How this is computed: first six words, footnote marks removed, compared with the reference.")+
   tile("Paragraphs flagged", '<span class="n '+(flagged.length?'bad':'ok')+'">'+flagged.length+'</span>',
     'of '+foundCount+' paragraphs found, on '+flaggedPages+' pages',
     "How this is computed: a suspect line (bare number, or number + capital) or over 300 words.")+
   tile("Footnotes", '<span class="n" style="font-size:26px;line-height:1.6">not separated</span>',
     hasRef? 'the document has '+(R.footnotes!=null?R.footnotes:'?') : 'no reference in this file',
     "How this is computed: this version leaves footnote text in place and flags it.")+
   '</div>';
  if(mismatches.length){
    html += '<div class="mismatch"><div class="mono" style="margin-bottom:6px">FIRST WORDS DIFFER · '+mismatches.length+'</div>';
    mismatches.slice(0,10).forEach(m=>{
      html += '<div class="row"><strong>para. '+m.num+':</strong> found \u201C'+esc(m.fw)+'\u201D / reference \u201C'+esc(R.first_words[String(m.num)]||"")+'\u201D</div>';
    });
    if(mismatches.length>10) html += '<div class="row">and '+(mismatches.length-10)+' more</div>';
    html += '</div>';
  }
  html += '<h2 class="fig">Take the paragraphs away</h2>'+
    '<div class="note">Both files carry the source, the fields and the known limitations. Footnotes are not separated.</div>'+
    '<button class="btn" id="dl-json">DOWNLOAD JSON</button> '+
    '<button class="btn ghost" id="dl-md">DOWNLOAD MARKDOWN</button>'+
    '<div class="how">How this is computed: the paragraphs exactly as parsed above, unedited.</div>';
  html += '<div style="margin-top:26px">'+
    '<button class="disc" id="disc-checks" aria-expanded="false"><span>EVERY CHECK ('+runCount+')</span><span>+</span></button>'+
    '<div id="body-checks" hidden></div></div>';
  html += '<div style="margin-top:14px">'+
    '<button class="disc" id="disc-flag" aria-expanded="false"><span>FLAGGED PARAGRAPHS ('+flagged.length+')</span><span>+</span></button>'+
    '<div id="body-flag" hidden></div></div>';
}
function tile(lbl,n,sub,how){
  return '<div class="tile"><div class="lbl">'+lbl+'</div>'+n+'<div class="sub">'+sub+'</div><div class="how">'+how+'</div></div>';
}
p1.innerHTML = html;

if(paras.length){
  // checks panel
  const cb = document.getElementById("body-checks");
  cb.innerHTML = checks.map(c=>{
    const st = c.status==="pass" ? '<span class="pass">pass</span>'
      : c.status==="fail" ? '<span class="fail">check failed</span>'
      : '<span class="mono" style="color:#7a7364">not run</span>';
    return '<div class="check-line"><span class="what"><strong>'+esc(c.what)+'</strong></span><span style="flex:1;min-width:260px">'+esc(c.detail)+(c.extra?' <em style="color:#5c5648">'+esc(c.extra)+'</em>':'')+'</span>'+st+'</div>';
  }).join("");
  // flagged panel
  const fb = document.getElementById("body-flag");
  let f = '<div class="note">This version does not separate footnotes from paragraphs. It shows where footnote text may sit, so you know which paragraphs to check against the PDF.</div>';
  if(flagged.length){
    f += '<table><caption>'+flagged.length+' paragraphs flagged, on '+flaggedPages+' pages</caption>'+
      '<thead><tr><th class="num">Para.</th><th class="num">Page</th><th class="num">Suspect lines</th><th>Why</th></tr></thead><tbody>';
    flagged.forEach(p=>{
      f += '<tr class="prow" data-num="'+p.num+'" tabindex="0" role="button" aria-expanded="false"><td class="num">'+p.num+'</td><td class="num">'+p.page_start+(p.page_end!==p.page_start?'\u2013'+p.page_end:'')+'</td><td class="num">'+p.suspectCount+'</td><td>'+esc(p.reasons.join("; "))+'</td></tr>';
    });
    f += '</tbody></table>';
  } else f += '<div class="note">No paragraphs flagged.</div>';
  fb.innerHTML = f;

  document.getElementById("disc-checks").addEventListener("click",function(){
    const open = this.getAttribute("aria-expanded")==="true";
    this.setAttribute("aria-expanded",String(!open));
    cb.hidden = open;
    this.lastElementChild.textContent = open?"+":"\u2013";
  });
  document.getElementById("disc-flag").addEventListener("click",function(){
    const open = this.getAttribute("aria-expanded")==="true";
    this.setAttribute("aria-expanded",String(!open));
    fb.hidden = open;
    this.lastElementChild.textContent = open?"+":"\u2013";
  });
  fb.querySelectorAll("tr.prow").forEach(r=>{
    const go = ()=>{ selectTab(1); openParagraph(+r.dataset.num, true); };
    r.addEventListener("click",go);
    r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go();}});
  });

  // downloads
  document.getElementById("dl-json").addEventListener("click",()=>download(fileBase()+".json", JSON.stringify(exportRecords,null,2), "application/json"));
  document.getElementById("dl-md").addEventListener("click",()=>download(fileBase()+".md", buildMarkdown(), "text/markdown"));
}
function fileBase(){ return (SYM||"document").replace(/\//g,"-"); }
function download(name, content, mime){
  const blob = new Blob([content],{type:mime+";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
function buildMarkdown(){
  const today = new Date().toISOString().slice(0,10);
  let md = "---\n";
  md += "title: \""+(D.title||"").replace(/"/g,"'")+"\"\n";
  md += "symbol: "+SYM+"\n";
  if(R.adopted) md += "adopted: "+R.adopted+"\n";
  md += "source_url: "+(D.doc_url||"")+"\n";
  md += "extracted: "+today+"\n";
  md += "paragraphs_found: "+foundCount+"\n";
  md += "paragraphs_expected: "+(hasRef?refParas:"unknown")+"\n";
  md += "paragraphs_flagged: "+flagged.length+"\n";
  md += "footnotes: not separated; the document has "+(R.footnotes!=null?R.footnotes:"an unknown number of")+" footnotes\n";
  md += "---\n\n";
  const events = [];
  headings.forEach(h=>events.push({idx:h.idx, head:h}));
  paras.forEach(p=>events.push({idx:p.startIdx, para:p}));
  events.sort((a,b)=>a.idx-b.idx);
  for(const e of events){
    if(e.head){
      md += (e.head.type==="roman"?"## ":"### ")+e.head.text+"\n\n";
    } else {
      const p = e.para;
      md += "**"+p.num+".** "+p.text+(p.flagged?" *(flagged: may contain footnote text)*":"")+"\n\n";
    }
  }
  return md;
}

/* ---------- panel 2 ---------- */
const p2 = panels[1];
let h2 = '<div style="margin-bottom:14px">'+
  '<button class="disc" id="disc-heads" aria-expanded="false"><span>HEADINGS FOUND: '+headings.length+'</span><span>+</span></button>'+
  '<div id="body-heads" hidden class="hlist"></div></div>';
h2 += '<table id="ptable"><caption>'+foundCount+' paragraphs found'+(hasRef?', '+refParas+' expected':'')+'</caption>'+
  '<thead><tr><th class="num">No.</th><th>Section</th><th class="num">Page</th><th>First line</th><th>Check</th></tr></thead><tbody id="pbody"></tbody></table>';
p2.innerHTML = h2;
document.getElementById("body-heads").innerHTML = headings.length
  ? '<ul class="hlist">'+headings.map(h=>'<li>'+esc(h.text)+' <span class="mono">'+h.type+' · p.'+linePage(h.idx)+'</span></li>').join("")+'</ul>'
  : '<div class="note">No headings found.</div>';
document.getElementById("disc-heads").addEventListener("click",function(){
  const open = this.getAttribute("aria-expanded")==="true";
  this.setAttribute("aria-expanded",String(!open));
  document.getElementById("body-heads").hidden = open;
  this.lastElementChild.textContent = open?"+":"\u2013";
});
function linePage(idx){ const L = lines[idx]; return L?L.page:"?"; }

const pbody = document.getElementById("pbody");
let rows = "";
paras.forEach((p,i)=>{
  const firstLine = p.text.length>120 ? p.text.slice(0,120).replace(/\s+\S*$/,"")+"\u2026" : p.text;
  const check = p.flagged ? '<span class="flag">may contain footnote text</span>'
    : p.fwMatch===false ? '<span class="flag">first words differ</span>'
    : p.fwMatch===null ? '<span class="mono" style="color:#7a7364">no reference</span>' : '<span class="okw">OK</span>';
  rows += '<tr class="prow" data-i="'+i+'" tabindex="0" role="button" aria-expanded="false" id="prow-'+p.num+'">'+
    '<td class="num">'+p.num+'</td><td>'+esc(p.section)+'</td><td class="num">'+p.page_start+(p.page_end!==p.page_start?'\u2013'+p.page_end:'')+'</td>'+
    '<td>'+esc(firstLine)+'</td><td>'+check+'</td></tr>';
  rows += '<tr class="pdetail" id="pdet-'+p.num+'" hidden><td colspan="5">'+
    '<div class="mono" style="margin-bottom:8px">'+esc(p.part ? p.part+' \u203A ' : '')+esc(p.section)+'</div>'+
    '<div class="ptext" id="ptext-'+p.num+'"></div>'+
    '<div class="how" style="margin-top:10px">first six words, found: \u201C'+esc(p.fw)+'\u201D'+
      (hasRef && R.first_words ? ' · reference: \u201C'+esc(R.first_words[String(p.num)]||"")+'\u201D' : ' · no reference in this file')+
    '</div>'+
    (p.flagged?'<div class="note flag">'+p.suspectCount+' suspect line'+(p.suspectCount===1?'':'s')+' highlighted above ('+esc(p.reasons.join("; "))+') \u2014 footnote text may sit inside; check against the PDF.</div>':'')+
    '<button class="copybtn" data-cite="'+esc(SYM)+', para. '+p.num+'">COPY CITATION · '+esc(SYM)+', para. '+p.num+'</button>'+
    '<button class="copybtn ghost" style="margin-left:8px;border:1px solid var(--rule);color:#5c5648" data-pdf="'+p.num+'">SHOW THE PDF\u2019S LINES</button>'+
    '<div class="pdflines" id="plines-'+p.num+'" hidden></div>'+
    '</td></tr>';
});
pbody.innerHTML = rows;

// paragraph text with suspect highlight
paras.forEach(p=>{
  const el = document.getElementById("ptext-"+p.num);
  el.innerHTML = p.lines.map(l=>'<span class="ln'+(l.suspect?' suspect':'')+'">'+esc(l.t)+'</span>').join(" ");
  const pl = document.getElementById("plines-"+p.num);
  let s = "", lastPage = null;
  for(const l of p.lines){
    if(l.page!==lastPage){ s += '<span class="pg">\u2014 page '+l.page+' \u2014</span>\n'; lastPage = l.page; }
    s += (l.suspect?"[[ ":"")+l.t+(l.suspect?" ]]":"")+"\n";
  }
  pl.innerHTML = s;
});

function toggleRow(i){
  const p = paras[i];
  const row = document.querySelector('tr.prow[data-i="'+i+'"]');
  const det = document.getElementById("pdet-"+p.num);
  const open = !det.hidden;
  det.hidden = open;
  row.setAttribute("aria-expanded",String(!open));
}
pbody.querySelectorAll("tr.prow").forEach(r=>{
  const i = +r.dataset.i;
  r.addEventListener("click",()=>toggleRow(i));
  r.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleRow(i);}});
});
function openParagraph(num, scroll){
  const i = paras.findIndex(p=>p.num===num);
  if(i<0) return;
  const det = document.getElementById("pdet-"+num);
  if(det.hidden) toggleRow(i);
  if(scroll){ const row = document.getElementById("prow-"+num); if(row) row.scrollIntoView({block:"center"}); }
}
pbody.addEventListener("click",e=>{
  const cite = e.target.closest("[data-cite]");
  if(cite){
    copyText(cite.dataset.cite, cite);
    return;
  }
  const pdfb = e.target.closest("[data-pdf]");
  if(pdfb){
    const el = document.getElementById("plines-"+pdfb.dataset.pdf);
    el.hidden = !el.hidden;
    pdfb.textContent = el.hidden ? "SHOW THE PDF\u2019S LINES" : "HIDE THE PDF\u2019S LINES";
  }
});
function copyText(s, btn){
  const done = ()=>{ const old = btn.textContent; btn.textContent = "COPIED"; setTimeout(()=>btn.textContent = old, 2000); };
  const fallback = ()=>{
    const ta = document.createElement("textarea");
    ta.value = s; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    ta.remove();
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(s).then(done).catch(fallback);
  } else fallback();
}

})();
</script>
</body>
</html>
