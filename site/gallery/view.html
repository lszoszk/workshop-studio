<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery app</title>
<meta name="robots" content="noindex, nofollow">
<script src="../gate.js"></script>
<link rel="stylesheet" href="../studio.css?v=2026-11-04a">
<style>
  body { display: flex; flex-direction: column; }
  .bar { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .bar a { color: var(--accent); }
  .stage-gal { position: relative; flex: 1; }
  #frame { position: absolute; inset: 0; border: 0; width: 100%; height: 100%; background: var(--surface); }
</style>
</head>
<body>
<div class="bar"><a href="./">← Gallery</a><span id="what">Loading…</span></div>
<div class="stage-gal">
  <iframe id="frame" title="App" sandbox="allow-scripts allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write"></iframe>
  <aside class="drawer wide" id="drawer" hidden>
    <div class="drawer-head"><h3 id="drawerTitle"></h3><button class="ghost icon" id="drawerClose" aria-label="Close">×</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<script src="../pdf-view.js?v=2026-11-04a"></script>
<script src="../preview-doc.js?v=2026-11-04a"></script>
<script>
(async function () {
  const app = new URLSearchParams(location.search).get('app') || '';
  if (!/^[a-z0-9-]+\/[a-z0-9-]+$/.test(app)) { document.getElementById('what').textContent = 'Unknown app.'; return; }
  const text = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(u + ': ' + r.status); return r.text(); });
  const [g, index, html, chart, runtime] = await Promise.all([
    text('gallery.json').then(JSON.parse), text('../data/index.json').then(JSON.parse),
    text('apps/' + app + '.html'), text('../vendor/chart.umd.min.js'), text('../runtime.js'),
  ]);
  const [model, prompt] = app.split('/');
  const m = g.models[model] || { name: model };
  const p = g.prompts.find((x) => x.id === prompt) || { title: prompt };
  document.getElementById('what').innerHTML = `<b>${m.name}</b> · ${p.title} · ${g.country}`;
  document.title = `${p.title} · ${m.name}`;
  const file = (k) => k === 'uhri' ? index.countries.find((c) => c.name === g.country).file : index.datasets[k].file;
  const dataText = async (k) => PreviewDoc.escapeScript(await text('../data/' + file(k)));
  document.getElementById('frame').srcdoc = PreviewDoc.forFrame(await PreviewDoc.build(html, { chart, runtime, dataText }));
})();
// the gallery has no studio around the app: it opens a PDF page in its own drawer, and there is no model to ask
document.getElementById('drawerClose').onclick = () => { document.getElementById('drawer').hidden = true; };
window.addEventListener('message', (e) => {
  const m = e.data || {};
  if (e.source !== document.getElementById('frame').contentWindow) return;
  if (m.type === 'studio:open-source') {
    const file = '../files/' + String(m.symbol).replace(/\//g, '_') + '.pdf', page = Number(m.page) || 1;
    document.getElementById('drawerTitle').textContent = m.symbol + ', page ' + page;
    document.getElementById('drawer').hidden = false;
    PdfView.open(document.getElementById('drawerBody'), file, page, m.quote,
      `<p class="src-head"><a href="${file}#page=${page}" target="_blank" rel="noopener">Open in a new tab</a></p>`, '../');
  }
  if (m.type === 'studio:ask') e.source.postMessage({ type: 'studio:answer', id: m.id, error: 'The gallery has no model. Open the studio with a seat code to try this step.' }, '*');
});
</script>
</body>
</html>
