<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The wall · Garage Research</title>
<meta name="robots" content="noindex, nofollow">
<script src="gate.js"></script>
<style>
  /* The facilitator's projector: every app a participant sent with Send to wall, live, on their own data.
     The look of the gallery and of the apps: paper, ink, one red accent, serif titles, monospace labels. */
  :root {
    --paper: #f4f0e8; --card: #fbf9f4; --ink: #1d1b18; --muted: #5b564c; --rule: #d9d2c3; --red: #9b2335;
    --serif: Georgia, "Times New Roman", serif; --mono: ui-monospace, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #191816; --card: #22201d; --ink: #ede8de; --muted: #a59f93; --rule: #3a3631; --red: #e0707f; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.5 var(--sans); }
  .mono { font: 12px/1.4 var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .wrap { max-width: 1680px; margin: 0 auto; padding: 0 28px 48px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--rule); }
  .bar svg { height: 26px; width: auto; display: block; }
  .bar .name { font-weight: 600; }
  .bar .live { margin-left: auto; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .bar .live i { width: 9px; height: 9px; border-radius: 50%; background: #2ea043; box-shadow: 0 0 0 3px rgba(46, 160, 67, .2); }
  .hero { display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap; padding: 24px 0 18px; }
  .hero h1 { font: 400 38px/1.1 var(--serif); margin: 0; }
  .hero .sub { color: var(--muted); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 22px; }
  .tile { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--rule); color: inherit; text-decoration: none;
    transition: box-shadow .15s, transform .15s; animation: arrive .5s ease-out; }
  .tile:hover, .tile:focus-visible { box-shadow: 0 10px 28px rgba(29, 27, 24, .14); transform: translateY(-2px); outline: none; border-color: var(--red); }
  @keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .thumb { position: relative; overflow: hidden; background: #fff; border-bottom: 1px solid var(--rule); }
  .thumb iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
  .thumb .wait { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font: 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
  .cap { padding: 12px 14px 14px; }
  .cap b { display: block; font: 400 19px/1.25 var(--serif); margin-bottom: 4px; }
  .cap span { font: 12px/1.4 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .empty { padding: 90px 24px; text-align: center; }
  .empty b { display: block; font: 400 30px/1.2 var(--serif); margin-bottom: 8px; }
  .empty span { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <svg viewBox="0 0 98 40" role="img" aria-label="Garage Research"><rect width="98" height="40" rx="8" fill="#141414"/><text x="12" y="28.5" fill="#fff" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="-0.5">GR</text><text x="55" y="28.5" fill="#5bd45b" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="23">&gt;_</text></svg>
    <span class="name">Garage Research</span><span class="mono" style="color:var(--muted)">· The wall</span>
    <span class="live mono"><i></i><span id="stamp">Live</span></span>
  </header>
  <section class="hero">
    <h1>Apps from the room</h1>
    <span class="sub" id="sub">Sent with <b>Send to wall</b>. Click one to open it full screen.</span>
  </section>
  <main class="tiles" id="tiles"></main>
  <p class="empty" id="empty" hidden><b>Nothing on the wall yet.</b><span>In the studio, <b>Send to wall</b> puts your app here.</span></p>
</div>
<script src="preview-doc.js?v=2026-11-12h"></script>
<script>
(async function () {
  const W = 1280, H = 800;   // the size an app is drawn at before it is scaled into its tile
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const text = (u) => fetch(u, { cache: 'no-cache' }).then((r) => { if (!r.ok) throw new Error(u + ': ' + r.status); return r.text(); });
  const [config, index, chart, runtime] = await Promise.all([
    text('config.json').then(JSON.parse), text('data/index.json').then(JSON.parse),
    text('vendor/chart.umd.min.js'), text('runtime.js')]);
  // on localhost, ?api= points the page at a local test server, as in the studio
  const api = new URLSearchParams(location.search).get('api');
  const local = (h) => h === 'localhost' || h === '127.0.0.1';
  const testApi = api && local(location.hostname) && local(new URL(api).hostname) ? api.replace(/\/$/, '') : null;
  const bases = testApi ? [testApi] : config.routes.filter((r) => r.type === 'server').map((r) => r.base);
  const cache = {};   // a data file is fetched once, however many apps use it
  const dataFor = (country) => (k) => {
    const f = k === 'uhri' ? (index.countries.find((c) => c.name === country) || index.countries[0]).file : index.datasets[k].file;
    return cache[f] || (cache[f] = text('data/' + f).then(PreviewDoc.escapeScript));
  };

  // thumbnails are drawn one at a time, and only once their tile is near the screen
  const queue = [];
  let drawing = false;
  async function drawNext() {
    if (drawing || !queue.length) return;
    drawing = true;
    const { tile, item, base } = queue.shift();
    try {
      const html = await text(base + '/gallery/' + item.id);
      const doc = await PreviewDoc.build(html, { chart, runtime, dataText: dataFor(item.country), files: item.files || [] });
      const f = document.createElement('iframe');
      f.setAttribute('sandbox', 'allow-scripts');
      f.setAttribute('tabindex', '-1');
      f.setAttribute('aria-hidden', 'true');
      f.srcdoc = PreviewDoc.forFrame(doc);
      const box = tile.querySelector('.thumb');
      box.append(f);
      fit(box);
      await new Promise((r) => { f.onload = r; setTimeout(r, 4000); });
      box.querySelector('.wait').remove();
    } catch (e) {
      tile.querySelector('.wait').textContent = 'Could not draw this app';
    }
    drawing = false;
    drawNext();
  }
  const seen = new IntersectionObserver((entries) => entries.forEach((e) => {
    if (!e.isIntersecting) return;
    seen.unobserve(e.target);
    queue.push(e.target._job);
    drawNext();
  }), { rootMargin: '400px' });

  function fit(box) {
    const s = box.clientWidth / W;
    box.style.height = Math.round(H * s) + 'px';
    const f = box.querySelector('iframe');
    if (f) f.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', () => document.querySelectorAll('.thumb').forEach(fit));

  const shown = new Set();
  async function refresh() {
    let items = null, base = null;
    for (const b of bases) {
      try { items = await text(b + '/gallery').then(JSON.parse); base = b; break; } catch (e) { /* the next server */ }
    }
    if (!items) { document.getElementById('stamp').textContent = 'The server is not answering; trying again.'; return; }
    const tiles = document.getElementById('tiles');
    const now = new Set(items.map((i) => i.id));   // a page removed on the admin page leaves the wall too
    tiles.querySelectorAll('.tile').forEach((t) => { if (!now.has(t._job.item.id)) { shown.delete(t._job.item.id); t.remove(); } });
    items.slice().reverse().forEach((item) => {   // oldest first in the data, newest first on the wall
      if (shown.has(item.id)) return;
      shown.add(item.id);
      const m = (config.models[item.model] || {}).label || 'A model';
      const a = document.createElement('a');
      a.className = 'tile';
      a.href = 'gallery/view.html?wall=' + encodeURIComponent(item.id) + (testApi ? '&api=' + encodeURIComponent(testApi) : '');
      a.innerHTML = `<div class="thumb"><span class="wait">Drawing…</span></div>
        <div class="cap"><b>${esc(item.title)}</b><span>${esc(item.country)} · ${esc(m)} · ${esc((item.created || '').slice(11, 16))}</span></div>`;
      a._job = { tile: a, item, base };
      tiles.prepend(a);
      fit(a.querySelector('.thumb'));
      seen.observe(a);
    });
    document.getElementById('empty').hidden = shown.size > 0;
    document.getElementById('sub').innerHTML = `${shown.size} app${shown.size === 1 ? '' : 's'} sent with <b>Send to wall</b>. Click one to open it full screen.`;
    document.getElementById('stamp').textContent = 'Updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  await refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
