<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Your app · Garage Research</title>
<meta name="robots" content="noindex, nofollow">
<script src="gate.js"></script>
<script>try { const t = localStorage.getItem('ws:theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="studio.css?v=2026-11-12f">
<style>
  /* The app in a tab of its own: the same sandbox as the studio's preview. Its requests to a
     model still go through the studio that opened it, so the Trace keeps every one. */
  body { overflow: hidden; }
  .tabbar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--panel); border-bottom: 1px solid var(--line); font-size: 14px; }
  .tabbar .logo { height: 22px; }
  .tabbar .follows { margin-left: auto; color: var(--faint); font-size: 13px; }
  .stage-tab { position: relative; height: calc(100% - 44px); }
  #frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div class="tabbar"><svg class="logo" viewBox="0 0 98 40" role="img" aria-label="Garage Research"><rect width="98" height="40" rx="8" fill="#141414"/><text x="12" y="28.5" fill="#fff" font-family="'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="23" letter-spacing="-0.5">GR</text><text x="55" y="28.5" fill="#5bd45b" font-family="ui-monospace, Menlo, Consolas, monospace" font-weight="700" font-size="23">&gt;_</text></svg><b id="title">Waiting for the studio…</b><span class="follows">This tab follows the studio: a new version appears here too.</span></div>
<div class="stage-tab">
  <iframe id="frame" title="Your app" sandbox="allow-scripts allow-forms allow-downloads allow-modals allow-popups allow-popups-to-escape-sandbox" allow="clipboard-write"></iframe>
  <aside class="drawer wide" id="drawer" hidden>
    <div class="drawer-head"><h3 id="drawerTitle"></h3><button class="ghost icon" id="drawerClose" aria-label="Close">×</button></div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<script src="pdf-view.js?v=2026-11-12f"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const studio = window.opener;
  const frame = $('frame');
  if (!studio) { $('title').textContent = 'Open this tab from the studio, with New tab above your app.'; return; }
  const pdfOf = (symbol) => 'files/' + String(symbol).replace(/\//g, '_') + '.pdf';
  let got = false;
  window.addEventListener('message', (e) => {
    const m = e.data || {};
    if (typeof m.type !== 'string' || !m.type.startsWith('studio:')) return;
    if (e.source === studio) {
      if (m.type === 'studio:app-doc') {
        got = true;
        frame.srcdoc = m.doc;
        $('title').textContent = m.title;
        document.title = m.title + ' · Garage Research';
      } else if (frame.contentWindow) {
        frame.contentWindow.postMessage(m, '*');   // the studio's answers to the app's model requests
      }
    } else if (e.source === frame.contentWindow) {
      if (m.type === 'studio:ask') studio.postMessage(m, '*');
      else if (m.type === 'studio:open-source') {
        const page = Number(m.page) || 1;
        $('drawerTitle').textContent = m.symbol + ', page ' + page;
        $('drawer').hidden = false;
        PdfView.open($('drawerBody'), pdfOf(m.symbol), page, m.quote,
          `<p class="src-head"><a href="${pdfOf(m.symbol)}#page=${page}" target="_blank" rel="noopener">Open in a new tab</a></p>`, '');
      }
    }
  });
  $('drawerClose').onclick = () => { $('drawer').hidden = true; };
  // say hello until the studio answers with the app (it may be busy, or not yet listening)
  (function hello(n) {
    if (got || n > 20 || studio.closed) return;
    studio.postMessage({ type: 'studio:tab-ready' }, '*');
    setTimeout(() => hello(n + 1), 600);
  })(0);
})();
</script>
</body>
</html>
